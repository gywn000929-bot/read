<!DOCTYPE html>
<html lang="ko" data-theme="beige">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>한국 문학 서재</title>
<meta name="description" content="저작권이 풀린 한국 근대문학을 읽는 리더 — 김유정·현진건·이효석·김소월">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf9f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --surface:#fff; --ink:#16130f; --sub:#6a655d; --faint:#94908a;
  --line:#e7e3da; --line2:#efece5; --accent:#0a3d62; --accent-soft:#e8eef5;
  --mark:#f6ecc9; --shadow:0 10px 40px rgba(20,16,10,.12);
  --cv-tint:rgba(10,61,98,.11); --on-accent:#fff;
  --myeongjo:'Nanum Myeongjo','Apple SD Gothic Neo','Malgun Gothic',serif;
  --gothic:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --sans:var(--gothic);
  --measure:34rem; --fs:19px; --lh:1.9;
}
html[data-theme="white"]{ --bg:#fff; --line:#e8e8ec; --line2:#f3f3f5; --accent-soft:#eaf1f8;
  --cv-tint:rgba(10,61,98,.09) }
html[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --ink:#e9e6df; --sub:#a2a8b0; --faint:#767c85;
  --line:#262b33; --line2:#1e232a; --accent:#7fb0ff; --accent-soft:#1c2836;
  --mark:#3d3413; --shadow:0 14px 50px rgba(0,0,0,.55);
  --cv-tint:rgba(127,176,255,.10); --on-accent:#0f1216;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:var(--mark)}

header.top{background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px clamp(12px,4vw,26px);position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand .k{font-size:9.5px;letter-spacing:2.5px;color:var(--faint);font-weight:600}
.brand .t{font-family:var(--myeongjo);font-size:clamp(17px,3.4vw,23px);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.tbtn{border:1px solid transparent;background:transparent;color:var(--sub);
  padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;cursor:pointer}
.tbtn:hover{background:var(--line2);color:var(--ink)}
.tbtn.on{background:var(--accent);color:var(--on-accent)}

main{padding:16px clamp(12px,4vw,26px) 20px;max-width:calc(var(--measure) + 7rem);margin:0 auto}
.reader.paged{max-width:min(1180px,100%)}

/* ── 본문 조판 ─────────────────────────────────────────────
   한국어는 word-break:keep-all 이 없으면 낱말 한가운데서 줄이 끊긴다. */
.body{font-family:var(--reading-font,var(--myeongjo));font-size:var(--fs);line-height:var(--lh);
  color:var(--ink);word-break:keep-all;overflow-wrap:break-word;font-kerning:normal}
.body p{margin:0 0 1.15em;max-width:var(--measure);text-wrap:pretty}
.body.indent p{margin-bottom:.2em;text-indent:1em}
.body.indent .chaphead + p,.body.indent p:first-child{text-indent:0}
/* 시는 줄바꿈이 뜻이다 — 흘려보내지 않고 그대로 세운다 */
.body.verse p{white-space:pre-line;margin:0 0 1.6em;text-indent:0;line-height:2.05}
.body .sent{border-radius:3px}
/* 장 안에 든 절 제목 — 위키문헌의 '== 제목 ==' 을 '### ' 로 실어 두었다 */
.body p.sect{font-family:var(--myeongjo);font-weight:700;font-size:1.02em;text-indent:0;
  margin:1.7em 0 .75em;break-after:avoid;-webkit-column-break-after:avoid;white-space:normal}
.body p.sect:first-child,.body .chaphead + p.sect{margin-top:0}
.chaphead{margin:0 0 18px}
.chaphead h1{font-family:var(--myeongjo);font-size:clamp(24px,4.2vw,38px);line-height:1.16;
  font-weight:800;letter-spacing:-.5px;margin:9px 0 13px}
.chaphead .kicker{color:var(--accent);letter-spacing:2px;font-size:11.5px;font-weight:700;
  font-family:var(--gothic)}
.chaphead .byline{font-size:13px;color:var(--sub);border-bottom:1px solid var(--line);
  padding-bottom:15px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;
  font-family:var(--gothic)}
.chaphead .byline b{color:var(--ink);font-weight:600;letter-spacing:.3px}
.chaphead .by{font-size:12px;color:var(--faint);font-family:var(--gothic)}

/* 쪽 넘김 — 본문을 다단으로 잘라 가로로 민다 */
.pageview{position:relative;overflow:hidden;touch-action:pan-y}
.body.paged{column-fill:auto;-webkit-column-fill:auto;overflow:hidden;
  overscroll-behavior:contain;orphans:2;widows:2}
.body.paged p{max-width:var(--measure);margin-inline:auto}
.body.paged .chaphead{break-inside:avoid;-webkit-column-break-inside:avoid}
.body.paged .pgbrk{display:block;height:0;margin:0;-webkit-column-break-before:always;break-before:column}
html.paged,html.paged body{overflow:hidden;overscroll-behavior:none}
.pgfoot{margin-top:13px}
.pagebar{display:flex;align-items:center;justify-content:center;gap:11px;
  padding-top:11px;border-top:1px solid var(--line)}
.pagebar button{border:1px solid var(--line);background:var(--surface);width:46px;height:38px;
  border-radius:10px;font-size:18px;line-height:1;flex:none}
.pagebar button:hover{border-color:var(--accent);color:var(--accent)}
.pagebar button:disabled{opacity:.3}
.pgtrack{flex:1;max-width:220px;height:4px;background:var(--line2);border-radius:3px;overflow:hidden}
.pgtrack i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s}
.pgn{font-size:12.5px;color:var(--sub);min-width:132px;text-align:center;font-variant-numeric:tabular-nums}
.bookdone{text-align:center;font-size:11px;color:var(--faint);margin-top:6px;
  line-height:15px;min-height:15px;font-variant-numeric:tabular-nums}  /* 빈 채로 높이를 재면 글자가 채워진 뒤 아래가 밀린다 — 자리를 미리 잡아 둔다 */

/* ── 작품 해설 ───────────────────────────────────────────── */
.note{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;
  padding:14px 16px;margin:0 0 20px;background:var(--surface);max-width:var(--measure)}
.note h3{font-family:var(--myeongjo);font-size:14px;margin:0 0 7px;color:var(--accent)}
.note p{font-family:var(--gothic);font-size:13.5px;line-height:1.75;color:var(--sub);margin:0;
  max-width:none;text-indent:0}
.note.none{border-left-color:var(--line);color:var(--faint)}

/* ── 서재 ───────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(20,16,10,.45)}
.modal.show{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  width:min(560px,100%);max-height:88dvh;overflow-y:auto;padding:20px}
.sh-top{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
.sh-top h2{font-family:var(--myeongjo);font-size:20px;margin:0}
.sh-top .ct{font-size:12px;color:var(--faint)}
.sh-top .x{margin-left:auto;border:1px solid var(--line);background:var(--surface);
  width:34px;height:34px;border-radius:9px;flex:none}
.find{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--bg);
  border-radius:12px;padding:0 13px;height:46px;margin-bottom:15px}
.find input{flex:1;border:none;background:none;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.find input:focus{outline:none}
.now{border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;
  align-items:center;gap:12px;margin-bottom:17px;background:var(--surface);width:100%;text-align:left}
.now .mini{width:42px;height:56px;border-radius:7px;background:var(--accent-soft);
  border:1px solid var(--line);flex:none}
.now .nt{font-family:var(--myeongjo);font-size:15px;font-weight:700}
.now .ns{font-size:11px;color:var(--sub);margin-top:3px}
.now .bar{height:3px;background:var(--line2);border-radius:3px;margin-top:6px}
.now .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.shelf{margin-bottom:17px}
.sh-h{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.sh-h .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.sh-h .nm{font-size:13px;font-weight:600}
.sh-h .ct{font-size:11px;color:var(--faint)}
.rail{display:flex;gap:9px;overflow-x:auto;padding:1px 2px 5px;scroll-snap-type:x proximity}
.bk{flex:none;width:108px;background:none;border:none;padding:0;text-align:left;font:inherit;
  scroll-snap-align:start}
.cv{height:142px;border-radius:10px;border:1px solid var(--line);padding:11px 10px;
  display:flex;align-items:flex-end;background:var(--surface);
  /* 단축 background 뒤에 와야 한다 — 앞에 두면 그것이 background-image 를 none 으로 덮는다 */
  background-image:linear-gradient(0deg,var(--cv-tint),var(--cv-tint))}
.bk.on .cv{border-color:var(--accent);border-width:2px}
.cv span{font-family:var(--myeongjo);font-size:13px;font-weight:700;line-height:1.3;
  word-break:keep-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.bk .bm{font-size:10.5px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
.none{color:var(--sub);font-size:13px;padding:18px 2px}
/* 옆 서재로 건너가는 줄 */
.sitelink{display:block;margin-top:16px;padding-top:13px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--sub);text-decoration:none;text-align:center}
.sitelink:hover{color:var(--accent)}

/* ── 목차 ───────────────────────────────────────────────── */
.toc{display:flex;flex-direction:column;gap:2px}
.toc button{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  border:none;background:none;padding:10px 11px;border-radius:9px;font:inherit;font-size:14px}
.toc button:hover{background:var(--accent-soft)}
.toc button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.toc .n{font-size:11px;color:var(--faint);min-width:26px;font-variant-numeric:tabular-nums}
.toc .tt{flex:1;font-family:var(--myeongjo);word-break:keep-all}
.toc .dn{font-size:11px;color:var(--faint)}

/* ── 설정 ───────────────────────────────────────────────── */
.setwrap{position:relative}
.setmenu{position:absolute;right:0;top:calc(100% + 9px);width:320px;max-width:calc(100vw - 22px);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:15px;z-index:70;display:none}
.setmenu.show{display:block}
.prev{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:12px;background:var(--bg)}
.prev .pk{font-size:10px;color:var(--faint);letter-spacing:.5px;margin-bottom:6px}
.prev p{margin:0;font-family:var(--reading-font,var(--myeongjo));font-size:min(var(--fs),18px);
  line-height:var(--lh);word-break:keep-all;max-height:5.4em;overflow:hidden}
.row{display:flex;align-items:center;gap:9px;min-height:52px;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:none}
.row .lb{font-size:12px;color:var(--sub);width:56px;flex:none}
.opts{display:flex;gap:5px;flex:1}
.opts button{flex:1;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--sub);
  border-radius:9px;font-size:12px}
.opts button:hover{border-color:var(--accent);color:var(--ink)}
.opts button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.set-swatch{display:inline-block;width:12px;height:12px;border-radius:50%;
  border:1px solid var(--line);margin-right:5px;vertical-align:-1px;flex:none}
.size{display:flex;align-items:center;gap:8px;flex:1}
.size button{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:9px;flex:none}
.size input{flex:1;accent-color:var(--accent);min-width:0}
.size .v{font-size:11.5px;color:var(--faint);min-width:36px;text-align:right}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);padding:11px 19px;border-radius:24px;font-size:14px;
  z-index:300;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.marks{margin-top:14px;border-top:1px solid var(--line2);padding-top:11px}
.marks .mk{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:12.5px}
.marks .mk:hover{background:var(--line2)}
.marks .mc{color:var(--accent);font-weight:700;white-space:nowrap;flex:none;font-size:11px}
.marks .mt{flex:1;min-width:0;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marks .mx{border:none;background:none;color:var(--faint);padding:2px 5px;border-radius:6px;flex:none}
@media (max-width:600px){ .body{font-size:calc(var(--fs) * .95)} }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="k">한국 근대문학</span>
    <span class="t" id="hTitle">서재</span>
  </div>
  <div class="sp"></div>
  <button class="tbtn" id="btnLib" title="서재">서재</button>
  <button class="tbtn" id="btnToc" title="목차">목차</button>
  <button class="tbtn" id="btnMark" title="북마크">🔖</button>
  <div class="setwrap">
    <button class="tbtn" id="btnSet" title="설정">⚙️</button>
    <div class="setmenu" id="setmenu">
      <div class="prev" id="prev">
        <div class="pk">미리보기</div>
        <p>산에는 꽃 피네. 꽃이 피네. 갈 봄 여름 없이 꽃이 피네.</p>
      </div>
      <div class="row"><div class="lb">테마</div><div class="opts" id="optTheme">
        <button data-theme="beige"><span class="set-swatch" style="background:#faf9f6"></span>베이지</button><button data-theme="white"><span class="set-swatch" style="background:#fff"></span>화이트</button><button data-theme="dark"><span class="set-swatch" style="background:#0f1216"></span>블랙</button>
      </div></div>
      <div class="row"><div class="lb">글꼴</div><div class="opts" id="optFont">
        <button data-font="myeongjo">명조</button><button data-font="gothic">고딕</button>
      </div></div>
      <div class="row"><div class="lb">글자 크기</div><div class="size">
        <button id="fsMinus">가−</button><input type="range" id="fsRange" min="15" max="32" step="1">
        <button id="fsPlus">가+</button><span class="v" id="fsVal">19px</span>
      </div></div>
      <div class="row"><div class="lb">줄 간격</div><div class="opts" id="optLh">
        <button data-lh="1.7">좁게</button><button data-lh="1.9">보통</button><button data-lh="2.2">넓게</button>
      </div></div>
      <div class="row"><div class="lb">본문 폭</div><div class="opts" id="optMeasure">
        <button data-measure="29rem">좁게</button><button data-measure="34rem">보통</button><button data-measure="40rem">넓게</button>
      </div></div>
      <div class="row"><div class="lb">문단</div><div class="opts" id="optPara">
        <button data-para="gap">여백</button><button data-para="indent">들여쓰기</button>
      </div></div>
    </div>
  </div>
</header>

<main id="main"><div class="empty">불러오는 중…</div></main>
<div class="modal" id="tocModal"></div>
<div class="modal" id="libModal"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ 상태 ============ */
const LS='hanbook_v1';
const defaults={ theme:'beige', font:'myeongjo', fs:19, lh:1.9, measure:'34rem', para:'gap',
  bookId:null, chapter:1, pagePos:{}, read:{}, marks:[], _q:'' };
let S=Object.assign({},defaults);
try{ Object.assign(S, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} };

let MANIFEST=[], curBook=null, cache={};
let pgPage=0, pgTotal=1, pgKey='', pgTimer=null;
const PG_GAP=44;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ============ 문장 나누기 ============
   한국어는 '~다. ~요. ~까?' 로 끝난다. 영어의 약어(Mr./Dr.) 규칙은 쓸 데가 없다.
   문장을 나누는 까닭은 쪽 경계에서 문장이 잘리지 않게 하려는 것이다. */
function splitSentences(p){
  const parts=p.match(/[^.!?…]*[.!?…]+["'’”』」』〉]*\s*|[^.!?…]+$/g);
  if(!parts) return [p];
  const out=[];
  for(const raw of parts){
    const s=raw.trim(); if(!s) continue;
    const prev=out[out.length-1];
    // 글자가 없는 부스러기나, 닫는 따옴표만 남은 조각은 앞 문장에 붙인다
    if(prev && !/[가-힣A-Za-z0-9]/.test(s)) out[out.length-1]=prev+' '+s;
    else out.push(s);
  }
  return out.length?out:[p];
}

/* ============ 책 ============ */
async function loadManifest(){
  const r=await fetch('books/manifest.json',{cache:'no-cache'});
  MANIFEST=await r.json();
}
async function loadBook(id){
  if(cache[id]) return cache[id];
  const r=await fetch('books/'+id+'.json'); if(!r.ok) throw new Error('load fail');
  const b=await r.json(); cache[id]=b; return b;
}
const book=()=>curBook;
const chap=n=>curBook.chapters.find(c=>c.n===n)||curBook.chapters[0];
const totalChaps=()=>curBook.chapters.length;
const isVerse=()=>curBook && curBook.kind==='verse';

async function openBook(id, ch){
  try{ curBook=await loadBook(id); }
  catch(e){ toast('책을 불러오지 못했어요'); return; }
  S.bookId=id;
  S.chapter = ch || (chap(S.chapter)? S.chapter : curBook.chapters[0].n);
  if(!curBook.chapters.find(c=>c.n===S.chapter)) S.chapter=curBook.chapters[0].n;
  save(); render();
}

/* ============ 그리기 ============ */
function render(){
  document.documentElement.classList.toggle('paged', true);
  const m=$('#main');
  if(!curBook){ m.innerHTML='<div class="empty">서재에서 책을 골라주세요.</div>'; return; }
  const b=book(), c=chap(S.chapter);
  $('#hTitle').textContent=b.title;

  const note = b.note
    ? `<div class="note"><h3>작품 해설</h3><p>${esc(b.note)}</p></div>`
    : `<div class="note none"><h3>작품 해설</h3><p>아직 해설을 붙이지 못했습니다.</p></div>`;

  const paras=(c.paras||[]).map((p,i)=>{
    if(/^###\s+/.test(p)) return `<p class="sect">${esc(p.replace(/^###\s+/,''))}</p>`;
    if(isVerse()) return `<p>${esc(p)}</p>`;
    const ss=splitSentences(p).map(s=>`<span class="sent">${esc(s)}</span>`).join(' ');
    return `<p>${ss}</p>`;
  }).join('');

  const head=`<div class="chaphead">
      <div class="kicker">${esc(b.title)}</div>
      <h1>${c.title? esc(c.title) : esc(b.title)}</h1>
      <div class="byline"><b>${esc(b.author||'')}</b>
        ${totalChaps()>1?`<span>${c.n} / ${totalChaps()}장</span>`:''}
        <span>${chapWords(c).toLocaleString()}낱말</span></div>
    </div>`;

  m.innerHTML=`<div class="reader paged">
      ${S.chapter===curBook.chapters[0].n? note : ''}
      <div class="pageview" id="pageView">
        <div class="body paged ${isVerse()?'verse':''} ${S.para==='indent'&&!isVerse()?'indent':''}" id="readBody">
          ${head}${paras}
        </div>
      </div>
      <div class="pgfoot" id="pgFoot">
      <div class="pagebar" id="pageBar">
        <button id="pPrev" aria-label="이전">‹</button>
        <div class="pgtrack"><i id="pgFill"></i></div>
        <span class="pgn" id="pgNum">1 / 1</span>
        <button id="pNext" aria-label="다음">›</button>
      </div>
      <div class="bookdone" id="bookDone"></div>
      </div>
    </div>`;
  $('#pPrev').addEventListener('click',pgPrev);
  $('#pNext').addEventListener('click',pgNext);
  bindSwipe();
  pgKey=S.bookId+':'+S.chapter;
  pgPage=S.pagePos[pgKey]||0;
  requestAnimationFrame(()=>pgRelayout());
}

/* ── 쪽 나누기 ───────────────────────────────────────────── */
const pgStep=vp=>vp.clientWidth+PG_GAP;
function pgRelayout(){
  const vp=$('#pageView'), body=$('#readBody');
  if(!vp||!body) return;
  body.querySelectorAll('.pgbrk').forEach(x=>x.remove());
  const bar=$('#pgFoot')||$('#pageBar'), mn=$('#main');
  const barH=bar? bar.offsetHeight+(parseFloat(getComputedStyle(bar).marginTop)||0):0;
  const padB=mn? (parseFloat(getComputedStyle(mn).paddingBottom)||0):0;
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  const lh=parseFloat(getComputedStyle(body).lineHeight)||0;
  const snap=v=>lh>0? Math.max(lh*4,Math.floor(v/lh)*lh) : Math.max(240,v);
  const w=Math.round(vp.clientWidth);
  const cols=w>=900?2:1;
  body.style.width=w+'px';
  body.style.columnGap=PG_GAP+'px';
  body.style.columnWidth=Math.floor((w-PG_GAP*(cols-1))/cols)+'px';
  let h=snap(Math.max(240, vh - vp.getBoundingClientRect().top - barH - padB));
  const setH=v=>{ vp.style.height=v+'px'; body.style.height=v+'px'; };
  setH(h);
  /* 줄 높이 단위로만 줄이므로 한 번에 딱 맞지 않는다 — 넘치는 동안 한 줄씩 더 줄인다.
     (몇 픽셀이 남으면 쪽 넘김 단추가 화면 밖으로 밀려난다) */
  for(let i=0;i<8;i++){
    const bottom=bar? bar.getBoundingClientRect().bottom : vp.getBoundingClientRect().bottom;
    const over=bottom+padB-vh;
    if(over<=0) break;
    let nx=snap(h-over); if(nx>=h) nx=Math.max(lh*4,h-lh);
    if(nx>=h) break; h=nx; setH(h);
  }
  body.scrollLeft=0;
  pgAvoidSplit();
  pgTotal=Math.max(1,Math.round((body.scrollWidth+PG_GAP)/(w+PG_GAP)));
  pgPage=Math.min(Math.max(0,pgPage),pgTotal-1);
  pgApply(false);
}
/* 쪽 경계에 걸린 문장(시는 연)을 통째로 다음 쪽으로 민다.
   CSS 만으로는 안 된다 — 인라인 요소에는 break-inside 가 걸리지 않는다. */
function pgAvoidSplit(){
  const vp=$('#pageView'), body=$('#readBody');
  if(!vp||!body) return;
  const step=pgStep(vp);
  const sel=isVerse()? 'p' : '.sent';
  for(let round=0; round<8; round++){
    const bx=body.getBoundingClientRect().left, sl=body.scrollLeft;
    const pageOf=x=>Math.floor((x-bx+sl)/step);
    const hits=[];
    for(const s of body.querySelectorAll(sel)){
      const prev=s.previousElementSibling;
      if(prev&&prev.classList.contains('pgbrk')) continue;
      const rs=s.getClientRects();
      if(rs.length<2) continue;
      if(pageOf(rs[rs.length-1].right-1)>pageOf(rs[0].left+1)) hits.push(s);
    }
    if(!hits.length) break;
    for(const s of hits){
      const brk=document.createElement('span'); brk.className='pgbrk';
      s.parentNode.insertBefore(brk,s);
    }
  }
}
/* ── 남은 시간·책 진도 ────────────────────────────────────
   낱말은 띄어쓰기 단위(어절)로 센다. 어른이 우리말 산문을 읽는 속도를
   분당 330어절로 잡았다 — 시는 천천히 읽히므로 절반으로 본다. */
const WPM=330;
let _cw={id:null,map:{}};
function chapWords(c){
  if(_cw.id!==S.bookId){ _cw={id:S.bookId,map:{}};
    (curBook.chapters||[]).forEach(x=>{ _cw.map[x.n]=(x.paras||[])
      .reduce((a,p)=>a+p.split(/\s+/).filter(Boolean).length,0); }); }
  return c? (_cw.map[c.n]||0) : 0;
}
const bookWords=()=>Object.values(_cw.map).reduce((a,b)=>a+b,0);
function minLeft(){
  const c=chap(S.chapter), left=chapWords(c)*(1-(pgPage+1)/Math.max(1,pgTotal));
  return Math.max(0, Math.round(left/(isVerse()? WPM/2 : WPM)));
}
function bookDone(){
  const c=chap(S.chapter); chapWords(c);
  const before=(curBook.chapters||[]).filter(x=>x.n<S.chapter)
    .reduce((a,x)=>a+(_cw.map[x.n]||0),0);
  const tot=bookWords()||1;
  return Math.min(100, Math.round((before+chapWords(c)*((pgPage+1)/Math.max(1,pgTotal)))/tot*100));
}

function pgApply(smooth){
  const vp=$('#pageView'), body=$('#readBody');
  if(!vp||!body) return;
  body.scrollTo({left:pgPage*pgStep(vp),behavior:smooth?'smooth':'auto'});
  if(pgKey){ S.pagePos[pgKey]=pgPage; save(); }
  const n=$('#pgNum');
  if(n){ const m=minLeft();
    n.textContent=`${pgPage+1} / ${pgTotal}` + (m>0? ` · ${m}분 남음` : ' · 곧 끝나요'); }
  const bi=$('#bookDone');
  if(bi) bi.textContent=(totalChaps()>1? `${S.chapter}장 · ` : '') + `책 ${bookDone()}%`;
  const f=$('#pgFill'); if(f) f.style.width=(pgTotal<2?100:(pgPage/(pgTotal-1))*100)+'%';
  const p=$('#pPrev'), x=$('#pNext');
  if(p) p.disabled = pgPage<=0 && S.chapter<=curBook.chapters[0].n;
  if(x) x.disabled = pgPage>=pgTotal-1 && S.chapter>=curBook.chapters[totalChaps()-1].n;
  const bm=$('#btnMark'); if(bm) bm.classList.toggle('on',!!markAt());
}
function pgGo(i){ pgPage=Math.min(Math.max(0,i),pgTotal-1); pgApply(true); }
function pgNext(){
  if(pgPage<pgTotal-1) return pgGo(pgPage+1);
  const i=curBook.chapters.findIndex(c=>c.n===S.chapter);
  if(i<totalChaps()-1){ S.read[S.bookId+':'+S.chapter]=1;
    S.chapter=curBook.chapters[i+1].n; pgPage=0; save(); render(); }
}
function pgPrev(){
  if(pgPage>0) return pgGo(pgPage-1);
  const i=curBook.chapters.findIndex(c=>c.n===S.chapter);
  if(i>0){ S.chapter=curBook.chapters[i-1].n; pgPage=1e9; save(); render(); }
}
function bindSwipe(){
  const vp=$('#pageView'); if(!vp) return;
  let sx=0,sy=0,st=0;
  vp.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); },{passive:true});
  vp.addEventListener('touchend',e=>{
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>800) return;
    if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.4) return;
    dx<0? pgNext() : pgPrev();
  },{passive:true});
  vp.addEventListener('click',e=>{
    if(e.target.closest('.note')) return;
    const r=vp.getBoundingClientRect(), x=e.clientX-r.left;
    if(x<r.width*.18) pgPrev(); else if(x>r.width*.82) pgNext();
  });
}

/* ============ 북마크 ============ */
const markAt=()=>(S.marks||[]).find(m=>m.bookId===S.bookId&&m.chapter===S.chapter&&m.page===pgPage);
function toggleMark(){
  if(!curBook) return;
  const ex=markAt();
  if(ex){ S.marks=S.marks.filter(m=>m!==ex); toast('북마크를 뺐어요'); }
  else{
    const el=$('#readBody .sent, #readBody p');
    S.marks.unshift({id:String(Date.now()),bookId:S.bookId,title:curBook.title,
      chapter:S.chapter,page:pgPage,text:(el?el.textContent:'').slice(0,50),t:Date.now()});
    S.marks=S.marks.slice(0,200); toast('북마크에 넣었어요');
  }
  save(); pgApply(false);
}

/* ============ 서재 ============ */
function libHTML(){
  const q=(S._q||'').trim().toLowerCase();
  const card=m=>`<button class="bk ${m.id===S.bookId?'on':''}" data-pick="${esc(m.id)}">
      <div class="cv"><span>${esc(m.title)}</span></div>
      <div class="bm">${(m.words||0).toLocaleString()}낱말${m.chapters>1?` · ${m.chapters}장`:''}</div>
    </button>`;
  const rail=l=>`<div class="rail">${l.map(card).join('')}</div>`;
  if(q){
    const hit=MANIFEST.filter(m=>(m.title+' '+(m.author||'')).toLowerCase().includes(q));
    return hit.length? `<div class="shelf"><div class="sh-h"><span class="nm">찾은 책</span>
        <span class="ct">${hit.length}권</span></div>${rail(hit)}</div>`
      : `<div class="none">'${esc(q)}' 로는 찾지 못했어요.</div>`;
  }
  let html='';
  const cur=MANIFEST.find(m=>m.id===S.bookId);
  if(cur&&curBook){
    const done=Math.round(((pgPage+1)/Math.max(1,pgTotal))*100);
    html+=`<button class="now" data-pick="${esc(cur.id)}">
      <div class="mini"></div>
      <div style="flex:1;min-width:0">
        <div class="nt">${esc(cur.title)}</div>
        <div class="ns">${esc(cur.author||'')} · ${S.chapter}장 · ${done}%</div>
        <div class="bar"><i style="width:${done}%"></i></div>
      </div></button>`;
  }
  const verse=MANIFEST.filter(m=>m.kind==='verse');
  if(verse.length) html+=`<div class="shelf"><div class="sh-h"><span class="dot"></span>
      <span class="nm">시</span><span class="ct">${verse.length}권</span></div>${rail(verse)}</div>`;
  const by={};
  MANIFEST.filter(m=>m.kind!=='verse').forEach(m=>{ (by[m.author]=by[m.author]||[]).push(m); });
  Object.keys(by).sort((a,b)=>by[b].length-by[a].length).forEach(a=>{
    html+=`<div class="shelf"><div class="sh-h"><span class="dot"></span>
      <span class="nm">${esc(a)}</span><span class="ct">${by[a].length}편</span></div>${rail(by[a])}</div>`;
  });
  return html;
}
function openLib(focus){
  const m=$('#libModal');
  m.innerHTML=`<div class="sheet">
    <div class="sh-top"><h2>서재</h2><span class="ct">${MANIFEST.length}권</span>
      <button class="x" id="libX">✕</button></div>
    <div class="find">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" style="color:var(--faint);flex:none">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.7" y2="16.7"></line></svg>
      <input id="libQ" type="search" placeholder="제목이나 작가로 찾기" value="${esc(S._q||'')}">
    </div>
    <div id="libBody">${libHTML()}</div>
    ${(S.marks||[]).length? `<div class="marks"><div class="sh-h"><span class="nm">🔖 북마크</span>
      <span class="ct">${S.marks.length}</span></div>`+
      S.marks.slice(0,12).map(k=>`<div class="mk" data-mk="${esc(k.id)}">
        <span class="mc">${esc(k.title).slice(0,10)} ${k.chapter}장 ${k.page+1}쪽</span>
        <span class="mt">${esc(k.text||'')}</span>
        <button class="mx" data-mx="${esc(k.id)}">✕</button></div>`).join('')+`</div>` : ''}
    <a class="sitelink" href="../">영어 원서 서재 — Book Study →</a>
  </div>`;
  m.classList.add('show');
  $('#libX').addEventListener('click',()=>m.classList.remove('show'));
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show'); });
  const q=$('#libQ');
  q.addEventListener('input',e=>{ S._q=e.target.value; $('#libBody').innerHTML=libHTML(); bindPicks(); });
  if(focus) q.focus();
  $$('#libModal [data-mk]').forEach(el=>el.addEventListener('click',ev=>{
    if(ev.target.dataset.mx) return;
    const k=S.marks.find(x=>x.id===el.dataset.mk); if(!k) return;
    m.classList.remove('show');
    pgPage=k.page; openBook(k.bookId,k.chapter);
  }));
  $$('#libModal [data-mx]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    S.marks=S.marks.filter(x=>x.id!==el.dataset.mx); save(); openLib(false);
  }));
  bindPicks();
}
function bindPicks(){
  $$('#libModal [data-pick]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.pick;
    $('#libModal').classList.remove('show');
    if(id!==S.bookId){ pgPage=0; openBook(id); }
  }));
}

/* ============ 목차 ============ */
function openToc(){
  if(!curBook) return toast('먼저 책을 골라주세요');
  const m=$('#tocModal');
  m.innerHTML=`<div class="sheet">
    <div class="sh-top"><h2>목차</h2><span class="ct">${esc(curBook.title)} · ${totalChaps()}장</span>
      <button class="x" id="tocX">✕</button></div>
    <div class="toc">${curBook.chapters.map(c=>`
      <button data-ch="${c.n}" class="${c.n===S.chapter?'on':''}">
        <span class="n">${c.n}</span><span class="tt">${esc(c.title||('제'+c.n+'장'))}</span>
        <span class="dn">${S.read[S.bookId+':'+c.n]?'읽음':''}</span>
      </button>`).join('')}</div>
  </div>`;
  m.classList.add('show');
  $('#tocX').addEventListener('click',()=>m.classList.remove('show'));
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show'); });
  $$('#tocModal [data-ch]').forEach(b=>b.addEventListener('click',()=>{
    m.classList.remove('show');
    const n=+b.dataset.ch;
    if(n!==S.chapter){ pgPage=0; S.chapter=n; save(); render(); }
  }));
}

/* ============ 설정 ============ */
function applyTheme(){
  const d=document.documentElement;
  d.setAttribute('data-theme',S.theme);
  d.style.setProperty('--reading-font', S.font==='gothic'?'var(--gothic)':'var(--myeongjo)');
  d.style.setProperty('--fs',S.fs+'px');
  d.style.setProperty('--lh',S.lh);
  d.style.setProperty('--measure',S.measure);
  const bd=$('#readBody');
  if(bd) bd.classList.toggle('indent', S.para==='indent' && !isVerse());
  $$('#optTheme button').forEach(b=>b.classList.toggle('on',b.dataset.theme===S.theme));
  $$('#optFont button').forEach(b=>b.classList.toggle('on',b.dataset.font===S.font));
  $$('#optLh button').forEach(b=>b.classList.toggle('on',+b.dataset.lh===+S.lh));
  $$('#optMeasure button').forEach(b=>b.classList.toggle('on',b.dataset.measure===S.measure));
  $$('#optPara button').forEach(b=>b.classList.toggle('on',b.dataset.para===S.para));
  const r=$('#fsRange'); if(r){ r.value=S.fs; $('#fsVal').textContent=S.fs+'px'; }
  requestAnimationFrame(()=>pgRelayout());
}
function bindChrome(){
  $('#btnLib').addEventListener('click',()=>openLib(true));
  $('#btnMark').addEventListener('click',toggleMark);
  $('#btnToc').addEventListener('click',openToc);
  const sb=$('#btnSet'), sm=$('#setmenu');
  sb.addEventListener('click',e=>{ e.stopPropagation(); sm.classList.toggle('show'); });
  document.addEventListener('click',e=>{ if(!sm.contains(e.target)&&e.target!==sb) sm.classList.remove('show'); });
  $$('#optTheme button').forEach(b=>b.addEventListener('click',()=>{ S.theme=b.dataset.theme; save(); applyTheme(); }));
  $$('#optFont button').forEach(b=>b.addEventListener('click',()=>{ S.font=b.dataset.font; save(); applyTheme(); }));
  $$('#optLh button').forEach(b=>b.addEventListener('click',()=>{ S.lh=+b.dataset.lh; save(); applyTheme(); }));
  $$('#optMeasure button').forEach(b=>b.addEventListener('click',()=>{ S.measure=b.dataset.measure; save(); applyTheme(); }));
  $$('#optPara button').forEach(b=>b.addEventListener('click',()=>{ S.para=b.dataset.para; save(); applyTheme(); }));
  $('#fsRange').addEventListener('input',e=>{ S.fs=+e.target.value; save(); applyTheme(); });
  $('#fsMinus').addEventListener('click',()=>{ S.fs=Math.max(15,S.fs-1); save(); applyTheme(); });
  $('#fsPlus').addEventListener('click',()=>{ S.fs=Math.min(32,S.fs+1); save(); applyTheme(); });
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); pgNext(); }
    if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); pgPrev(); }
  });
  let rt=null;
  addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>pgRelayout(),180); });
}

const BUILD='0825-ko-01';
async function init(){
  bindChrome(); applyTheme();
  try{ await loadManifest(); }
  catch(e){ $('#main').innerHTML='<div class="empty">책 목록을 불러오지 못했어요.</div>'; return; }
  const first=(MANIFEST.find(m=>m.id===S.bookId)||MANIFEST[0]);
  if(first) await openBook(first.id, S.bookId===first.id? S.chapter : null);
  applyTheme();
  console.log('한국 문학 서재', BUILD, MANIFEST.length+'권');
}
init();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
