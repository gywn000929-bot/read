<!DOCTYPE html>
<html lang="ko" data-theme="beige">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>한국 문학 서재</title>
<meta name="description" content="저작권이 풀린 한국 근대문학을 읽는 리더 — 김유정·현진건·이효석·김소월">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf9f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --surface:#fff; --ink:#16130f; --sub:#6a655d; --faint:#94908a;
  --line:#e7e3da; --line2:#efece5; --accent:#0a3d62; --accent-soft:#e8eef5;
  --mark:#f6ecc9; --shadow:0 10px 40px rgba(20,16,10,.12);
  --cv-tint:rgba(10,61,98,.11); --on-accent:#fff;
  --myeongjo:'Nanum Myeongjo','Apple SD Gothic Neo','Malgun Gothic',serif;
  --ridi:'RIDIBatang','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  --bonmyeongjo:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  --gowun:'Gowun Batang','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  --pretendard:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --barun:'NanumBarunGothic',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --gothic:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --sans:var(--gothic);
  --measure:34rem; --fs:19px; --lh:1.9;
}
html[data-theme="white"]{ --bg:#fff; --line:#e8e8ec; --line2:#f3f3f5; --accent-soft:#eaf1f8;
  --cv-tint:rgba(10,61,98,.09) }
/* 세피아 — 누렇게 익은 종이. 오래 봐도 눈이 덜 시린 밝은 테마다. */
html[data-theme="sepia"]{
  --bg:#f3e7d3; --surface:#faf2e2; --ink:#3f3222; --sub:#6d5b44; --faint:#8b7a63;
  --line:#ddccb0; --line2:#ebdfc8; --accent:#8a5324; --accent-soft:#eddcc0;
  --mark:#f0d59a; --shadow:0 10px 40px rgba(70,50,20,.16);
  --cv-tint:rgba(138,83,36,.12); --on-accent:#fff8ec;
}
/* 잿빛 — 블랙과 흰 바탕 사이. 밤에 읽되 새까만 화면이 부담스러울 때 쓴다. */
html[data-theme="ash"]{
  --bg:#30343b; --surface:#3a3f47; --ink:#e3e1dc; --sub:#a9aeb6; --faint:#848a93;
  --line:#4b515b; --line2:#40454e; --accent:#93bdf5; --accent-soft:#414c5c;
  --mark:#4b4224; --shadow:0 14px 50px rgba(0,0,0,.45);
  --cv-tint:rgba(147,189,245,.11); --on-accent:#20242a;
}
html[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --ink:#e9e6df; --sub:#a2a8b0; --faint:#767c85;
  --line:#262b33; --line2:#1e232a; --accent:#7fb0ff; --accent-soft:#1c2836;
  --mark:#3d3413; --shadow:0 14px 50px rgba(0,0,0,.55);
  --cv-tint:rgba(127,176,255,.10); --on-accent:#0f1216;
}
/* 한글 본문 글꼴. 선언만 해 두면 브라우저는 이 글꼴로 실제 글자를 그릴 때
   비로소 파일을 받아온다 — 설정에서 고르지 않은 사람은 한 바이트도 안 받는다.
   swap 이라 받아오는 동안에도 글은 곧바로 보인다. */
@font-face{font-family:'RIDIBatang';font-display:swap;font-weight:400;
  src:url('../fonts/RIDIBatang.woff2') format('woff2')}
@font-face{font-family:'NanumBarunGothic';font-display:swap;font-weight:400;
  src:url('../fonts/NanumBarunGothic.woff2') format('woff2')}
@font-face{font-family:'Noto Serif KR';font-display:swap;font-weight:400;
  src:url('../fonts/NotoSerifKR.woff2') format('woff2')}
@font-face{font-family:'Gowun Batang';font-display:swap;font-weight:400;
  src:url('../fonts/GowunBatang.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-display:swap;font-weight:400;
  src:url('../fonts/Pretendard.woff2') format('woff2')}
/* 사이트 탭 — 영어 원서 서재와 한국 문학 서재를 오간다.
   일부러 고정(sticky)하지 않았다. 아래 리더 머리말이 이미 top:0 에 붙어 있어서
   같이 붙이면 겹치고, 읽는 화면에서 세로를 두 줄이나 잡아먹는다. */
.sitetabs{display:flex;gap:4px;background:var(--surface);
  border-bottom:1px solid var(--line);padding:7px clamp(12px,4vw,26px) 0}
.sitetabs a{text-decoration:none;color:var(--sub);font-size:13px;font-weight:600;
  padding:9px 14px;border-radius:10px 10px 0 0;border:1px solid transparent;
  border-bottom:none;display:flex;align-items:center;gap:6px;white-space:nowrap;
  margin-bottom:-1px;transition:.15s}
.sitetabs a:hover{color:var(--ink);background:var(--line2)}
.sitetabs a.on{color:var(--accent);background:var(--bg);border-color:var(--line)}
.cloud{border-top:1px solid var(--line2);margin-top:12px;padding-top:12px}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.cdot.on{background:var(--good,#2f8f57)}
.cst{flex:1;min-width:0;font-size:11.5px;color:var(--sub);line-height:1.5}
.crow .go{border:1px solid var(--line);background:var(--surface);color:var(--sub);
  border-radius:8px;padding:5px 10px;font-size:11.5px;cursor:pointer;flex:none;
  font-family:var(--gothic)}
.crow .go:hover{border-color:var(--accent);color:var(--accent)}
.locallist .li button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* 책 넣기 */
.bw-add{width:100%;margin-top:7px;border:1px dashed var(--line);background:transparent;
  color:var(--sub);border-radius:11px;padding:10px;font-size:12.5px;cursor:pointer;
  font-family:var(--gothic)}
.bw-add:hover{border-color:var(--accent);color:var(--accent)}
.impdrop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;
  color:var(--sub);cursor:pointer;font-size:13.5px;margin:14px 0}
.impdrop:hover,.impdrop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.impdrop .di{display:block;font-size:26px;margin-bottom:8px}
.impdrop .ds{display:block;font-size:11.5px;color:var(--faint);margin-top:6px}
.hide{display:none}
.fld{margin:10px 0}
.fld label{display:block;font-size:11.5px;color:var(--faint);margin-bottom:5px}
.fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg);color:var(--ink);font-size:14px;font-family:var(--gothic)}
.fld input:focus{border-color:var(--accent);outline:none}
.impbtns{display:flex;gap:8px;margin-top:16px}
.bigbtn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;
  font-family:var(--gothic)}
.bigbtn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.locallist{margin-top:16px;border-top:1px solid var(--line2);padding-top:12px}
.locallist .li{display:flex;align-items:center;gap:9px;padding:8px 4px;font-size:13px}
.locallist .li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locallist .li .m{font-size:11px;color:var(--faint);flex:none}
.locallist .li button{border:1px solid var(--line);background:var(--surface);color:var(--sub);
  border-radius:8px;padding:4px 9px;font-size:11.5px;cursor:pointer;flex:none}
.locallist .li button:hover{border-color:var(--bad,#b23a2b);color:var(--bad,#b23a2b)}
.impnote{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:12px}
/* 옆단 — 영어 원서 리더와 같은 짜임. 넓은 화면에서는 왼쪽 붙박이,
   좁은 화면에서는 ☰ 로 여는 서랍이 된다.
   붙는 높이(--hh)는 숫자를 박지 않고 JS 가 머리말을 재서 넣는다.
   브랜드가 두 줄이라 화면 폭에 따라 높이가 달라진다. */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1360px;margin:0 auto}
aside{border-right:1px solid var(--line);background:var(--surface);padding:16px;
  overflow-y:auto;max-height:calc(100dvh - var(--hh,64px));position:sticky;top:var(--hh,64px)}
#overlay{display:none;position:fixed;inset:0;background:rgba(20,16,10,.42);z-index:55}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;display:none;align-items:center;justify-content:center;font-size:18px;
  flex:none;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.bookswitch{margin-bottom:14px}
.bookswitch .bw-lbl{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.6px;margin:0 2px 6px}
.bw-now{width:100%;display:flex;align-items:center;gap:9px;border:1px solid var(--line);
  background:var(--surface);border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left}
.bw-now:hover{border-color:var(--accent)}
.bw-now .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--accent)}
.bw-now .t{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-now .c{font-size:11px;color:var(--faint);flex:none}
.bookcard{background:var(--accent-soft);border-radius:12px;padding:13px 14px;margin-bottom:14px}
.bookcard .bt{font-family:var(--myeongjo);font-size:18px;font-weight:800;line-height:1.15;word-break:keep-all}
.bookcard .ba{font-size:12px;color:var(--sub);margin-top:2px}
.progbar{height:6px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden}
.progbar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.progtxt{font-size:11px;color:var(--faint);margin-top:6px;display:flex;justify-content:space-between}
.marklist{margin:14px 0 4px;border-top:1px solid var(--line2);padding-top:12px}
.marklist .mk{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;cursor:pointer}
.marklist .mk:hover{background:var(--line2)}
.marklist .mkc{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;flex:none}
.marklist .mkt{flex:1;min-width:0;font-size:12.5px;color:var(--sub);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.marklist .mkx{border:none;background:none;color:var(--faint);cursor:pointer;font-size:12px;
  padding:2px 5px;border-radius:6px;flex:none}
.marklist .mkx:hover{color:var(--bad,#b23a2b);background:var(--line)}
.searchbox{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg);color:var(--ink);font-size:13px;margin-bottom:12px;font-family:var(--gothic)}
.searchbox:focus{border-color:var(--accent);outline:none}
.artitem{padding:11px 10px;border-radius:11px;cursor:pointer;transition:.12s;
  display:flex;align-items:center;gap:10px}
.artitem:hover{background:var(--line2)}
.artitem.sel{background:var(--accent-soft)}
.artitem .h{font-family:var(--myeongjo);font-size:14px;font-weight:600;line-height:1.3;
  flex:1;min-width:0;word-break:keep-all}
.artitem .h .cn{display:inline-block;min-width:20px;color:var(--accent);font-weight:800;
  font-variant-numeric:tabular-nums}
.readdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;border:1px solid var(--line)}
.artitem.done .readdot{background:var(--good,#2f8f57);border-color:var(--good,#2f8f57)}
.emptymini{color:var(--faint);font-size:13px;padding:10px}
/* 읽는 화면에서 위 껍데기가 세로를 너무 먹었다 — 폰에서 사이트 탭과 머리말이
   화면 위쪽을 계속 차지했고, 쪽 모드는 창이 아예 스크롤되지 않아 늘 그대로였다. */
@media(max-width:960px){
  .wrap{grid-template-columns:1fr}
  .iconbtn{display:flex}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(85vw,320px);z-index:56;max-height:100dvh;
    transform:translateX(-100%);transition:transform .22s;border-right:1px solid var(--line)}
  body.drawer aside{transform:translateX(0)}
  body.drawer #overlay{display:block}
  /* 서재를 오가는 탭은 서랍 맨 위로 옮긴다 — 읽는 동안 쓸 일이 없는데 자리를 먹었다 */
  .sitetabs{display:none}
  #sidebar .sblibs{display:flex;gap:6px;margin-bottom:14px}
  .sblibs a{flex:1;text-decoration:none;text-align:center;padding:10px 8px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--sub);
    font-size:12.5px;font-weight:600;white-space:nowrap}
  .sblibs a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  /* 이 서재는 늘 쪽 모드라 창이 스크롤되지 않는다. 그래서 '내리면 접힌다' 는
     길이 없고, 대신 머리말 키를 낮춰 쪽에 돌려준다. */
  header.top{padding:7px 13px;gap:8px}
  .iconbtn{width:36px;height:36px}
  .tbtn{padding:8px 9px;font-size:13px}
  /* 머리글 'ㅎㅏㄴㄱㅜㄱ…' — 이 줄만 nowrap 이 없어서, 자리가 좁아지면 한 글자씩
     세로로 쪼개지며 머리말을 104px 까지 밀어 올렸다. 폰에서는 아예 접는다. */
  .brand .k{display:none}
  /* 남는 자리를 밀어내던 빈칸을 없애고 책 이름에 준다 — 그러지 않으면 단추들이
     자리를 다 가져가 제목이 말줄임표 한 점으로 찌그러진다. */
  .sp{display:none}
  .brand{flex:1 1 auto;min-width:0}
  /* '서재' 와 '목차' 는 폰에서 ☰ 서랍이 이미 다 갖고 있다 — 책 고르기도, 장 목록도.
     머리말에 또 두면 자리만 먹고 책 이름이 한 글자로 찌그러진다. */
  #btnLib,#btnToc{display:none}
}
.sblibs{display:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:var(--mark)}

header.top{background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px clamp(12px,4vw,26px);position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand .k{font-size:9.5px;letter-spacing:2.5px;color:var(--faint);font-weight:600}
.brand .t{font-family:var(--myeongjo);font-size:clamp(17px,3.4vw,23px);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.tbtn{border:1px solid transparent;background:transparent;color:var(--sub);
  padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;cursor:pointer}
.tbtn:hover{background:var(--line2);color:var(--ink)}
.tbtn.on{background:var(--accent);color:var(--on-accent)}

main{padding:16px clamp(12px,4vw,26px) 20px;max-width:calc(var(--measure) + 7rem);margin:0 auto}
/* 쪽 보기에서는 폭 제한을 푼다. 이 제한이 본문을 화면 크기와 상관없이 656px 로
   묶어 두어서, 넓은 화면에서 남는 자리가 통째로 버려지고 두 쪽 나누기(w>=900)도
   영영 걸리지 않았다. 실제 폭은 .reader.paged 의 1180px 이 정한다.
   한 줄 길이는 여기서가 아니라 단 나누기가 정하므로 읽기 불편해지지 않는다.
   width:100% 가 필요하다 — main 은 격자 항목인데 margin:0 auto 가 붙어 있어서,
   그냥 두면 칸(1060px)을 채우지 않고 내용 크기(596px)로 쪼그라든다.
   격자에서 auto 여백은 남는 자리를 흡수하고 항목을 fit-content 로 만든다. */
html.paged main{max-width:min(1180px,100%);width:100%}
.reader.paged{max-width:min(1180px,100%)}

/* ── 본문 조판 ─────────────────────────────────────────────
   한국어는 word-break:keep-all 이 없으면 낱말 한가운데서 줄이 끊긴다. */
.body{font-family:var(--reading-font,var(--myeongjo));font-size:var(--fs);line-height:var(--lh);
  color:var(--ink);word-break:keep-all;overflow-wrap:break-word;font-kerning:normal}
.body p{margin:0 0 1.15em;max-width:var(--measure);text-wrap:pretty}
.body.indent p{margin-bottom:.2em;text-indent:1em}
.body.indent .chaphead + p,.body.indent p:first-child{text-indent:0}
/* 시는 줄바꿈이 뜻이다 — 흘려보내지 않고 그대로 세운다 */
.body.verse p{white-space:pre-line;margin:0 0 1.6em;text-indent:0;line-height:2.05}
.body .sent{border-radius:3px}
/* 장 안에 든 절 제목 — 위키문헌의 '== 제목 ==' 을 '### ' 로 실어 두었다 */
.body p.sect{font-family:var(--myeongjo);font-weight:700;font-size:1.02em;text-indent:0;
  margin:1.7em 0 .75em;break-after:avoid;-webkit-column-break-after:avoid;white-space:normal}
.body p.sect:first-child,.body .chaphead + p.sect{margin-top:0}
.chaphead{margin:0 0 18px}
.chaphead h1{font-family:var(--myeongjo);font-size:clamp(24px,4.2vw,38px);line-height:1.16;
  font-weight:800;letter-spacing:-.5px;margin:9px 0 13px}
.chaphead .kicker{color:var(--accent);letter-spacing:2px;font-size:11.5px;font-weight:700;
  font-family:var(--gothic)}
.chaphead .byline{font-size:13px;color:var(--sub);border-bottom:1px solid var(--line);
  padding-bottom:15px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;
  font-family:var(--gothic)}
.chaphead .byline b{color:var(--ink);font-weight:600;letter-spacing:.3px}
.chaphead .by{font-size:12px;color:var(--faint);font-family:var(--gothic)}

/* 쪽 넘김 — 본문을 다단으로 잘라 가로로 민다 */
.pageview{position:relative;overflow:hidden;touch-action:pan-y}
.body.paged{column-fill:auto;-webkit-column-fill:auto;overflow:hidden;
  overscroll-behavior:contain;orphans:2;widows:2}
.body.paged p{max-width:var(--measure);margin-inline:auto}
.body.paged .chaphead{break-inside:avoid;-webkit-column-break-inside:avoid}
.body.paged .pgbrk{display:block;height:0;margin:0;-webkit-column-break-before:always;break-before:column}
html.paged,html.paged body{overflow:hidden;overscroll-behavior:none}
.pgfoot{margin-top:13px}
.pagebar{display:flex;align-items:center;justify-content:center;gap:11px;
  padding-top:11px;border-top:1px solid var(--line)}
.pagebar button{border:1px solid var(--line);background:var(--surface);width:46px;height:38px;

/* 해설은 쪽 바깥에 있어서, 첫 장에서는 모든 쪽마다 자리를 지킨다.
   390×760 폰에서 237px — 화면의 3분의 1이었다. 폰에서는 접어 두고 눌러서 편다. */
.note summary{font-family:var(--myeongjo);font-size:14px;color:var(--accent);font-weight:700;

  background:var(--ink);color:var(--bg);padding:11px 19px;border-radius:24px;font-size:14px;

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ 상태 ============ */
const LS='hanbook_v1';
/* 테마 한 벌. 머리말 고르개와 설정 줄이 같은 표를 본다 — 한 곳만 고치면 둘 다 바뀐다.
   차례는 밝은 것에서 어두운 것으로. 하루가 흐르는 차례라 눈으로 짚기 쉽다. */
const THEMES=[
  {k:'beige',n:'베이지',c:'#faf9f6'},
  {k:'white',n:'화이트',c:'#ffffff'},
  {k:'sepia',n:'세피아',c:'#f3e7d3'},
  {k:'ash',  n:'잿빛',  c:'#30343b'},
  {k:'dark', n:'블랙',  c:'#0f1216'},
];
/* 단추가 아직 없을 때만 그린다 — applyTheme 은 설정을 만질 때마다 도는데,
   그때마다 새로 그리면 눌린 단추가 사라져 :active 표시가 깜빡인다. */
function renderThemePickers(){
  const html=THEMES.map(t=>
    `<button data-theme="${t.k}"><span class="set-swatch" style="background:${t.c}"></span>${t.n}</button>`).join('');
  ['#optTheme','#thememenu'].forEach(sel=>{
    const el=$(sel); if(el&&!el.children.length) el.innerHTML=html; });
}
const defaults={ theme:'beige', font:'myeongjo', fs:19, lh:1.9, measure:'34rem', para:'gap',
  bookId:null, chapter:1, pagePos:{}, read:{}, marks:[], _q:'',
  /* 동기화 — 무덤(지운 것)이 없으면 다른 기기가 지운 것을 되살려 놓는다 */
  del:{b:{},m:{}}, lastT:0, cloudAt:0 };
let S=Object.assign({},defaults);
try{ Object.assign(S, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  if(typeof cloudTouch==='function') cloudTouch(); };

let MANIFEST=[], curBook=null, cache={};
let pgPage=0, pgTotal=1, pgKey='', pgTimer=null;
const PG_GAP=44;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ============ 문장 나누기 ============
   한국어는 '~다. ~요. ~까?' 로 끝난다. 영어의 약어(Mr./Dr.) 규칙은 쓸 데가 없다.
   문장을 나누는 까닭은 쪽 경계에서 문장이 잘리지 않게 하려는 것이다. */
function splitSentences(p){
  const parts=p.match(/[^.!?…]*[.!?…]+["'’”』」』〉]*\s*|[^.!?…]+$/g);
  if(!parts) return [p];
  const out=[];
  for(const raw of parts){
    const s=raw.trim(); if(!s) continue;
    const prev=out[out.length-1];
    // 글자가 없는 부스러기나, 닫는 따옴표만 남은 조각은 앞 문장에 붙인다
    if(prev && !/[가-힣A-Za-z0-9]/.test(s)) out[out.length-1]=prev+' '+s;
    else out.push(s);
  }
  return out.length?out:[p];
}

/* ============ 책 ============ */

/* ---- 내가 넣은 책 저장 ---- /ko/ 에는 저장 계층이 없었다. 책은 전부 books/*.json
   에서 받아 왔다. 넣은 책은 그 자리가 없으므로 IndexedDB 를 새로 둔다.
   목록은 따로 localStorage 에 적어 둔다 — 목차 한 줄 만들자고 책을 통째로
   읽어올 것이 아니다. */
const IDB_NAME='koread', IDB_STORE='books';
let _db=null;
function idb(){
  if(_db) return _db;
  _db=new Promise((res,rej)=>{
    const q=indexedDB.open(IDB_NAME,1);
    q.onupgradeneeded=()=>{ if(!q.result.objectStoreNames.contains(IDB_STORE)) q.result.createObjectStore(IDB_STORE); };
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  });
  return _db;
}
async function idbRun(mode,fn){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,mode), r=fn(tx.objectStore(IDB_STORE));
    tx.oncomplete=()=>res(r?r.result:undefined); tx.onerror=()=>rej(tx.error);
  });
}
const idbPut=(k,v)=>idbRun('readwrite',st=>st.put(v,k));
const idbGet=(k)=>idbRun('readonly',st=>st.get(k));
const idbDel=(k)=>idbRun('readwrite',st=>st.delete(k));
/* 아이폰 사파리에서 IndexedDB 가 아무 응답도 안 주는 일이 있다.
   그냥 기다리면 앱이 영영 '불러오는 중…' 에서 멈춘다 — 기다림에 시간 제한을 둔다. */
function withTimeout(pr,ms,fb){
  return Promise.race([Promise.resolve(pr).catch(()=>fb),
    new Promise(r=>setTimeout(()=>r(fb),ms))]);
}
const MET='koread_meta';
const bookMeta=b=>({id:b.id,title:b.title,author:b.author,
  chapters:(b.chapters||[]).length,words:b.words||0,local:true,
  localOnly:!!b.localOnly, t:b.t||0});
function metaAll(){ try{ const v=JSON.parse(localStorage.getItem(MET)||'null'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function metaPut(b){ try{ const l=metaAll().filter(x=>x.id!==b.id); l.push(bookMeta(b));
  localStorage.setItem(MET,JSON.stringify(l)); }catch(e){} }
function metaDel(id){ try{ localStorage.setItem(MET,JSON.stringify(metaAll().filter(x=>x.id!==id))); }catch(e){} }
async function loadManifest(){
  const r=await fetch('books/manifest.json',{cache:'no-cache'});
  MANIFEST=await r.json();
  MANIFEST=MANIFEST.concat(metaAll());   // 내가 넣은 책도 서재에 함께
}
async function loadBook(id){
  if(cache[id]) return cache[id];
  /* 내가 넣은 책은 저장소에 있다. 저장소가 굼떠도 앱이 멈추지 않게 시간 제한을 둔다 */
  const mine=await withTimeout(idbGet(id),4000,null).catch(()=>null);
  if(mine&&Array.isArray(mine.chapters)&&mine.chapters.length){ cache[id]=mine; return mine; }
  const r=await fetch('books/'+id+'.json'); if(!r.ok) throw new Error('load fail');
  const b=await r.json(); cache[id]=b; return b;
}
const book=()=>curBook;
const chap=n=>curBook.chapters.find(c=>c.n===n)||curBook.chapters[0];
const totalChaps=()=>curBook.chapters.length;
const isVerse=()=>curBook && curBook.kind==='verse';

async function openBook(id, ch){
  try{ curBook=await loadBook(id); }
  catch(e){ toast('책을 불러오지 못했어요'); return; }
  S.bookId=id;
  S.chapter = ch || (chap(S.chapter)? S.chapter : curBook.chapters[0].n);
  if(!curBook.chapters.find(c=>c.n===S.chapter)) S.chapter=curBook.chapters[0].n;
  save(); render();
}

/* ============ 그리기 ============ */

/* ---- 옆단 ---- 영어 원서 리더와 같은 짜임: 책 고르기 · 진행 · 책갈피 · 장 목록.
   '내 책 열기'는 여기에 없다 — /ko/ 에는 책을 넣는 기능 자체가 없다. */
function sbHeight(){
  const h=document.querySelector('header.top');
  if(h) document.documentElement.style.setProperty('--hh', Math.round(h.getBoundingClientRect().height)+'px');
}
function closeDrawer(){ document.body.classList.remove('drawer'); }


/* ---- 자동 동기화 ---- 영어 원서 서재와 같은 방식. 로그인이 없고, 같은 데이터베이스에서
   경로만 달리 쓴다. 여기서 맞추는 것은 읽은 장·책갈피·쪽 위치·내가 넣은 책이다.
   설정(테마·글꼴 같은 것)은 기기마다 다를 수 있으므로 올리지 않는다.

   ⚠️ 로그인이 없다는 것은 주소를 아는 사람은 누구나 읽고 쓸 수 있다는 뜻이다.
   남에게 보이면 안 되는 책은 책 목록에서 '📵 이 기기에만' 을 눌러 막아 둘 것. */
const RTDB_URL='https://wall-street-57bf4-default-rtdb.firebaseio.com';
const RTDB_PATH='koread';                    // 영어판(bookstudy)과 경로를 나눠 쓴다
const UP_KEY='koread_uploaded';              // 이미 올린 책 — 매번 다시 올리지 않으려고
let rtBusy=false, pushTimer=null, pollTimer=null, rtErr='', appReady=false, lastSync=0;

/* RTDB 키에 못 쓰는 글자(. # $ / [ ])를 되돌릴 수 있게 바꾼다.
   '%' 도 함께 바꿔야 되돌릴 때 원래 '%' 와 섞이지 않는다. */
const rtEnc=k=>String(k).replace(/[%.#$/[\]]/g,c=>'%'+c.charCodeAt(0).toString(16));
const rtDec=k=>String(k).replace(/%([0-9a-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
function rtErrText(st){
  if(st===401||st===403) return '데이터베이스 규칙이 막고 있어요 — Rules 에서 '+RTDB_PATH+' 경로를 열어주세요';
  if(st===404) return '데이터베이스 주소를 찾지 못했어요';
  return '동기화하지 못했어요 (네트워크를 확인해 주세요)';
}
async function rtReq(method,sub,body,query){
  const q=[query||'', method==='GET'?'t='+Date.now():''].filter(Boolean).join('&');
  const url=RTDB_URL+'/'+RTDB_PATH+(sub?'/'+sub:'')+'.json'+(q?'?'+q:'');
  const opt={method,cache:'no-store'};
  if(body!==undefined){ opt.headers={'Content-Type':'application/json'}; opt.body=JSON.stringify(body); }
  const r=await fetch(url,opt);
  if(!r.ok){ const e=new Error(rtErrText(r.status)); e.status=r.status; throw e; }
  return r.status===200? r.json() : null;
}
function uploadedMap(){ try{ const v=JSON.parse(localStorage.getItem(UP_KEY)||'{}');
  return (v&&typeof v==='object'&&!Array.isArray(v))? v : {}; }catch(e){ return {}; } }
function markUploaded(m){ try{ localStorage.setItem(UP_KEY,JSON.stringify(m)); }catch(e){} }
function upForget(id){ const m=uploadedMap(); delete m[id]; markUploaded(m); }
function stamp(b){ if(b) b.t=Date.now(); return b; }

/* 받아서 합친다 — 지우지 않고, 읽은 장은 합집합, 책갈피는 더 최근 것을 남긴다.
   applyLast 는 앱을 막 열었을 때만 참 — 읽는 도중 폴링이 화면을 옮기면 안 된다. */
async function rtPull(applyLast){
  const [d,ids]=await Promise.all([
    rtReq('GET','state'),
    rtReq('GET','books',undefined,'shallow=true').catch(()=>null)
  ]);
  const before=JSON.stringify([S.read,S.marks,S.pagePos]);
  let added=0, moved=false;
  if(d){
    /* 무덤부터 — 지운 것을 되살리지 않으려면 합치기보다 먼저 알아야 한다 */
    const rd=d.deleted||{};
    ['b','m'].forEach(k=>{ const src=rd[k==='b'?'books':'marks']||{};
      Object.entries(src).forEach(([kk,t])=>{ const id=rtDec(kk);
        if(!S.del[k][id]||S.del[k][id]<t) S.del[k][id]=t; }); });
    Object.entries(d.read||{}).forEach(([k])=>{ S.read[rtDec(k)]=1; });          // 읽음은 합집합
    Object.entries(d.pagePos||{}).forEach(([k,v])=>{ const id=rtDec(k);
      if((S.pagePos[id]||0)<v) S.pagePos[id]=v; });                              // 더 많이 읽은 쪽
    const mine=new Map((S.marks||[]).map(m=>[m.id,m]));
    Object.entries(d.marks||{}).forEach(([k,v])=>{ if(!v||!v.id) return;
      const id=rtDec(k);
      if(S.del.m[id]) return;                                                    // 지운 것은 안 받는다
      const cur=mine.get(id);
      if(!cur||(v.t||0)>(cur.t||0)) mine.set(id,v);
    });
    S.marks=[...mine.values()].filter(m=>!S.del.m[m.id]).sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,200);
    if(applyLast&&d.last&&(d.last.t||0)>(S.lastT||0)){
      if(d.last.bookId&&d.last.bookId!==S.bookId){ S.bookId=d.last.bookId; moved=true; }
      if(d.last.chapter) S.chapter=d.last.chapter;
      if(typeof d.last.page==='number') pgPage=d.last.page;
      S.lastT=d.last.t;
    }
  }
  /* 다른 기기가 올린 책 받기 — 여기 없는 것만 */
  for(const k of Object.keys(ids||{})){
    const id=rtDec(k);
    if(S.del.b[id]) continue;                                   // 지운 책은 다시 받지 않는다
    const cur=await idbGet(id).catch(()=>null);
    if(cur&&cur.localOnly) continue;                            // 이 기기에만 두기로 한 책은 건드리지 않는다
    if(cur) continue;
    const b=await rtReq('GET','books/'+k).catch(()=>null);
    if(!b||!b.id||!Array.isArray(b.chapters)||!b.chapters.length) continue;
    await idbPut(id,b).catch(()=>{}); metaPut(b); added++;
  }
  save();
  return { changed: added>0||moved||JSON.stringify([S.read,S.marks,S.pagePos])!==before, added, moved };
}
function rtDrop(kind,key){
  const node=kind==='books'?'books':'state/marks';
  rtReq('PATCH',node,{[rtEnc(key)]:null}).catch(e=>console.error(e));
  if(kind==='books') rtReq('PATCH','state/bookT',{[rtEnc(key)]:null}).catch(()=>{});
}
async function rtPush(force){
  clearTimeout(pushTimer);
  if(rtBusy&&!force){ cloudTouch(); return false; }
  const read={}, marks={}, pagePos={};
  Object.keys(S.read||{}).forEach(k=>read[rtEnc(k)]=true);
  (S.marks||[]).forEach(m=>marks[rtEnc(m.id)]=m);
  Object.entries(S.pagePos||{}).forEach(([k,v])=>pagePos[rtEnc(k)]=v);
  const db={},dm={};
  Object.entries(S.del.m).forEach(([k,t])=>{ dm[rtEnc(k)]=t; marks[rtEnc(k)]=null; });
  Object.entries(S.del.b).forEach(([k,t])=>db[rtEnc(k)]=t);
  /* 자식 노드마다 따로 보낸다 — PATCH 는 최상위 키를 통째로 갈아끼우므로, 한 번에
     보내면 그 사이 다른 기기가 넣은 것이 지워진다. 한 걸음이 막혀도 뒤는 계속한다. */
  const fail=[];
  const step=async(sub,body)=>{ try{ await rtReq('PATCH',sub,body); }catch(e){ fail.push(e); } };
  if(Object.keys(read).length) await step('state/read',read);
  if(Object.keys(marks).length) await step('state/marks',marks);
  if(Object.keys(pagePos).length) await step('state/pagePos',pagePos);
  if(Object.keys(dm).length) await step('state/deleted/marks',dm);
  if(Object.keys(db).length){
    await step('state/deleted/books',db);
    const nulls=Object.fromEntries(Object.keys(db).map(k=>[k,null]));
    await step('books',nulls); await step('state/bookT',nulls);
  }
  const last={ bookId:S.bookId, chapter:S.chapter, page:pgPage, t:Date.now() };
  await step('state',{last}); S.lastT=last.t;
  /* 넣은 책은 한 권이 수 MB 라 매번 올릴 것이 아니다 — 마지막으로 올린 시각과
     지금 책의 시각이 다를 때만 올린다. 비교는 목록표로 하므로 안 올릴 책은 펼치지 않는다. */
  const up=uploadedMap(), mt={};
  metaAll().forEach(m=>{ mt[m.id]=m.t||0; });
  for(const m of metaAll()){
    const id=m.id;
    if(up[id]!==undefined && up[id]===mt[id]) continue;
    const b=await idbGet(id).catch(()=>null);
    if(!b) continue;
    if(!b.t){ stamp(b); await idbPut(id,b).catch(()=>{}); metaPut(b); }
    if(b.localOnly){ up[id]=b.t; markUploaded(up); continue; }   // 이 기기에만 — 안 올린다
    try{
      await rtReq('PUT','books/'+rtEnc(id),b);
      await rtReq('PATCH','state/bookT',{[rtEnc(id)]:b.t});
      up[id]=b.t; markUploaded(up);
    }catch(e){ fail.push(e); }
  }
  S.cloudAt=fail.length? (S.cloudAt||0) : Date.now();
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}   // save() 를 부르면 되돌이가 된다
  clearTimeout(pushTimer);
  if(fail.length) throw fail[0];
  return true;
}
async function cloudSync(quiet,applyLast){
  if(rtBusy||!appReady) return false;
  if(navigator.onLine===false) return false;
  rtBusy=true;
  try{
    const r=await rtPull(applyLast);
    await rtPush(true);
    lastSync=Date.now(); rtErr='';
    if(r.changed){
      MANIFEST=MANIFEST.filter(m=>!m.local).concat(metaAll());
      if(r.moved||r.added){ curBook=await loadBook(S.bookId).catch(()=>curBook); }
      if(curBook&&!chap(S.chapter)) S.chapter=curBook.chapters[0].n;
      render();
    }
    if(!quiet) toast(r.added? `맞췄어요 — 책 ${r.added}권 받아옴` : '맞췄어요');
    renderCloudBox();
    return true;
  }catch(e){
    console.error(e); rtErr=e.message||'동기화하지 못했어요';
    if(!quiet) toast(rtErr);
    renderCloudBox(); return false;
  }finally{ rtBusy=false; }
}
/* 바뀔 때마다 곧바로 올리지 않고 잠깐 모았다가 한 번에 */
function cloudTouch(){
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ if(appReady) rtPush().catch(e=>console.error(e)); },4000);
}
function startPoll(){
  clearInterval(pollTimer);
  pollTimer=setInterval(()=>{
    if(document.hidden||navigator.onLine===false||rtBusy) return;
    cloudSync(true,false).catch(e=>console.error(e));
  },20000);
}
async function cloudBoot(){
  appReady=true;
  await cloudSync(true,true).catch(()=>{});
  startPoll();
}
function cloudFlush(){ clearTimeout(pushTimer); if(appReady) rtPush().catch(()=>{}); }
addEventListener('pagehide',cloudFlush);
addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ cloudFlush(); return; }
  if(Date.now()-lastSync>20000) cloudSync(true,false).catch(e=>console.error(e));
});
addEventListener('online',()=>cloudSync(true,false).catch(()=>{}));
function renderCloudBox(){
  const el=$('#cloudBox'); if(!el) return;
  const when=S.cloudAt? new Date(S.cloudAt).toLocaleString('ko-KR',
    {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : null;
  el.innerHTML=`<div class="bw-lbl">☁️ 자동 동기화</div>
    <div class="crow"><span class="cdot${rtErr?'':' on'}"></span>
      <span class="cst">${rtErr? '⚠️ '+esc(rtErr)
        : `켜짐 — 이 앱을 연 모든 기기가 맞춰집니다${when?` · 마지막 ${esc(when)}`:''}`}</span>
      <button class="go" id="rtNow">지금 맞추기</button></div>
    <p class="impnote">로그인이 없습니다. 읽은 장·책갈피·내가 넣은 책이 기기끼리 같아집니다.
      대신 <b>주소를 아는 사람은 누구나 같은 데이터를 봅니다</b> — 남에게 보이면 안 되는 책은
      책 목록에서 <b>📵 이 기기에만</b> 을 눌러 두세요.</p>`;
  const b=$('#rtNow'); if(b) b.addEventListener('click',()=>cloudSync(false,false));
}

/* ---- 책 넣기 ---- EPUB 과 평문을 받는다. 푸는 일은 lib/bookparse.js 가 하고

   불러오지 않고, 한국 문학 서재에서 쓸 일도 드물다. */
let _imp=null;                       // 방금 푼 책 (아직 저장 전)
function closeImport(){ $('#impModal').classList.remove('show'); _imp=null; }

      <p class="impnote">넣은 책은 이 브라우저 안에만 저장됩니다. 다른 기기로는 넘어가지

    else { delete up[id]; toast('이제 올립니다'); }
    markUploaded(up); save(); openImport();

async function importFile(file){
  const body=$('#impBody');
  body.innerHTML='<div class="impdrop">읽는 중… <span class="ds" id="impP"></span></div>';
  const setP=(a,b)=>{ const e=$('#impP'); if(e) e.textContent=b?`${a} / ${b}`:''; };
  try{
    const id=await fileId(file);
    const seen=await withTimeout(idbGet(id),4000,null).catch(()=>null);
    if(seen&&Array.isArray(seen.chapters)&&seen.chapters.length){
      cache[id]=seen; closeImport(); await openBook(id,S.chapter||1);
      return toast('이미 넣은 책이에요 — 읽던 곳으로 갑니다');
    }
    const name=cleanName(file.name);
    let bk;
    if(/\.epub$/i.test(file.name)||file.type==='application/epub+zip'){
      const ep=await epubLines(file,setP); setP(1,1);

        const alt=docsToBook(ep.docs,em);

      bk=linesToBook(txtLines(await file.text()),{id,title:name,author:'',lang:'ko'});

function render(){

  m.innerHTML=`<div class="reader paged">
      ${S.chapter===curBook.chapters[0].n? note : ''}

          ${head}${paras}
        </div>
      </div>
      <div class="pgfoot" id="pgFoot">
      <div class="pagebar" id="pageBar">
        <button id="pPrev" aria-label="이전">‹</button>
        <div class="pgtrack"><i id="pgFill"></i></div>
        <span class="pgn" id="pgNum">1 / 1</span>
        <button id="pNext" aria-label="다음">›</button>

      </div>

  const nt=m.querySelector('.note');

}

/* ── 쪽 나누기 ───────────────────────────────────────────── */
const pgStep=vp=>vp.clientWidth+PG_GAP;
function pgRelayout(){
  const vp=$('#pageView'), body=$('#readBody');
  if(!vp||!body) return;
  body.querySelectorAll('.pgbrk').forEach(x=>x.remove());
  const bar=$('#pgFoot')||$('#pageBar'), mn=$('#main');
  const barH=bar? bar.offsetHeight+(parseFloat(getComputedStyle(bar).marginTop)||0):0;
  const padB=mn? (parseFloat(getComputedStyle(mn).paddingBottom)||0):0;
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  const lh=parseFloat(getComputedStyle(body).lineHeight)||0;
  const snap=v=>lh>0? Math.max(lh*4,Math.floor(v/lh)*lh) : Math.max(240,v);
  const w=Math.round(vp.clientWidth);
  const cols=w>=900?2:1;
  body.style.width=w+'px';
  body.style.columnGap=PG_GAP+'px';
  body.style.columnWidth=Math.floor((w-PG_GAP*(cols-1))/cols)+'px';
  let h=snap(Math.max(240, vh - vp.getBoundingClientRect().top - barH - padB));
  const setH=v=>{ vp.style.height=v+'px'; body.style.height=v+'px'; };
  setH(h);
  /* 줄 높이 단위로만 줄이므로 한 번에 딱 맞지 않는다 — 넘치는 동안 한 줄씩 더 줄인다.
     (몇 픽셀이 남으면 쪽 넘김 단추가 화면 밖으로 밀려난다) */
  for(let i=0;i<8;i++){
    const bottom=bar? bar.getBoundingClientRect().bottom : vp.getBoundingClientRect().bottom;
    const over=bottom+padB-vh;
    if(over<=0) break;
    let nx=snap(h-over); if(nx>=h) nx=Math.max(lh*4,h-lh);
    if(nx>=h) break; h=nx; setH(h);
  }
  body.scrollLeft=0;
  pgAvoidSplit();
  pgTotal=Math.max(1,Math.round((body.scrollWidth+PG_GAP)/(w+PG_GAP)));
  pgPage=Math.min(Math.max(0,pgPage),pgTotal-1);
  pgApply(false);
}
/* 쪽 경계에 걸린 문장(시는 연)을 통째로 다음 쪽으로 민다.
   CSS 만으로는 안 된다 — 인라인 요소에는 break-inside 가 걸리지 않는다. */
function pgAvoidSplit(){
  const vp=$('#pageView'), body=$('#readBody');
  if(!vp||!body) return;
  const step=pgStep(vp);
  const sel=isVerse()? 'p' : '.sent';
  for(let round=0; round<8; round++){
    const bx=body.getBoundingClientRect().left, sl=body.scrollLeft;
    const pageOf=x=>Math.floor((x-bx+sl)/step);
    const hits=[];
    for(const s of body.querySelectorAll(sel)){
      const prev=s.previousElementSibling;
      if(prev&&prev.classList.contains('pgbrk')) continue;
      const rs=s.getClientRects();
      if(rs.length<2) continue;
      if(pageOf(rs[rs.length-1].right-1)>pageOf(rs[0].left+1)) hits.push(s);
    }
    if(!hits.length) break;
    for(const s of hits){
      const brk=document.createElement('span'); brk.className='pgbrk';
      s.parentNode.insertBefore(brk,s);
    }
  }
}
/* ── 남은 시간·책 진도 ────────────────────────────────────
   낱말은 띄어쓰기 단위(어절)로 센다. 어른이 우리말 산문을 읽는 속도를
   분당 330어절로 잡았다 — 시는 천천히 읽히므로 절반으로 본다. */
const WPM=330;
let _cw={id:null,map:{}};
function chapWords(c){
  if(_cw.id!==S.bookId){ _cw={id:S.bookId,map:{}};
    (curBook.chapters||[]).forEach(x=>{ _cw.map[x.n]=(x.paras||[])
      .reduce((a,p)=>a+p.split(/\s+/).filter(Boolean).length,0); }); }
  return c? (_cw.map[c.n]||0) : 0;
}
const bookWords=()=>Object.values(_cw.map).reduce((a,b)=>a+b,0);
function minLeft(){
  const c=chap(S.chapter), left=chapWords(c)*(1-(pgPage+1)/Math.max(1,pgTotal));
  return Math.max(0, Math.round(left/(isVerse()? WPM/2 : WPM)));
}
function bookDone(){
  const c=chap(S.chapter); chapWords(c);
  const before=(curBook.chapters||[]).filter(x=>x.n<S.chapter)
    .reduce((a,x)=>a+(_cw.map[x.n]||0),0);
  const tot=bookWords()||1;
  return Math.min(100, Math.round((before+chapWords(c)*((pgPage+1)/Math.max(1,pgTotal)))/tot*100));
}

function pgApply(smooth){
  const vp=$('#pageView'), body=$('#readBody');
  if(!vp||!body) return;
  body.scrollTo({left:pgPage*pgStep(vp),behavior:smooth?'smooth':'auto'});
  if(pgKey){ S.pagePos[pgKey]=pgPage; save(); }
  const n=$('#pgNum');
  if(n){ const m=minLeft();
    n.textContent=`${pgPage+1} / ${pgTotal}` + (m>0? ` · ${m}분 남음` : ' · 곧 끝나요'); }
  const bi=$('#bookDone');
  if(bi) bi.textContent=(totalChaps()>1? `${S.chapter}장 · ` : '') + `책 ${bookDone()}%`;
  const f=$('#pgFill'); if(f) f.style.width=(pgTotal<2?100:(pgPage/(pgTotal-1))*100)+'%';
  const p=$('#pPrev'), x=$('#pNext');
  if(p) p.disabled = pgPage<=0 && S.chapter<=curBook.chapters[0].n;
  if(x) x.disabled = pgPage>=pgTotal-1 && S.chapter>=curBook.chapters[totalChaps()-1].n;
  const bm=$('#btnMark'); if(bm) bm.classList.toggle('on',!!markAt());
}
function pgGo(i){ pgPage=Math.min(Math.max(0,i),pgTotal-1); pgApply(true); }
function pgNext(){
  if(pgPage<pgTotal-1) return pgGo(pgPage+1);
  const i=curBook.chapters.findIndex(c=>c.n===S.chapter);
  if(i<totalChaps()-1){ S.read[S.bookId+':'+S.chapter]=1;
    S.chapter=curBook.chapters[i+1].n; pgPage=0; save(); render(); }
}
function pgPrev(){
  if(pgPage>0) return pgGo(pgPage-1);
  const i=curBook.chapters.findIndex(c=>c.n===S.chapter);
  if(i>0){ S.chapter=curBook.chapters[i-1].n; pgPage=1e9; save(); render(); }
}
function bindSwipe(){
  const vp=$('#pageView'); if(!vp) return;
  let sx=0,sy=0,st=0;
  vp.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); },{passive:true});
  vp.addEventListener('touchend',e=>{
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>800) return;
    if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.4) return;
    dx<0? pgNext() : pgPrev();
  },{passive:true});
  vp.addEventListener('click',e=>{
    if(e.target.closest('.note')) return;
    const r=vp.getBoundingClientRect(), x=e.clientX-r.left;
    if(x<r.width*.18) pgPrev(); else if(x>r.width*.82) pgNext();
  });
}

/* ============ 북마크 ============ */
const markAt=()=>(S.marks||[]).find(m=>m.bookId===S.bookId&&m.chapter===S.chapter&&m.page===pgPage);
function toggleMark(){
  if(!curBook) return;
  const ex=markAt();
  if(ex){ S.marks=S.marks.filter(m=>m!==ex); toast('북마크를 뺐어요'); }
  else{
    const el=$('#readBody .sent, #readBody p');
    S.marks.unshift({id:String(Date.now()),bookId:S.bookId,title:curBook.title,
      chapter:S.chapter,page:pgPage,text:(el?el.textContent:'').slice(0,50),t:Date.now()});
    S.marks=S.marks.slice(0,200); toast('북마크에 넣었어요');
  }
  save(); pgApply(false);
}

function libHTML(){
  const q=(S._q||'').trim().toLowerCase();
  const card=m=>`<button class="bk ${m.id===S.bookId?'on':''}" data-pick="${esc(m.id)}">
      <div class="cv"><span>${esc(m.title)}</span></div>
      <div class="bm">${(m.words||0).toLocaleString()}낱말${m.chapters>1?` · ${m.chapters}장`:''}</div>
    </button>`;
  const rail=l=>`<div class="rail">${l.map(card).join('')}</div>`;
  if(q){
    const hit=MANIFEST.filter(m=>(m.title+' '+(m.author||'')).toLowerCase().includes(q));
    return hit.length? `<div class="shelf"><div class="sh-h"><span class="nm">찾은 책</span>
        <span class="ct">${hit.length}권</span></div>${rail(hit)}</div>`
      : `<div class="none">'${esc(q)}' 로는 찾지 못했어요.</div>`;
  }
  let html='';
  const cur=MANIFEST.find(m=>m.id===S.bookId);
  if(cur&&curBook){
    const done=Math.round(((pgPage+1)/Math.max(1,pgTotal))*100);
    html+=`<button class="now" data-pick="${esc(cur.id)}">
      <div class="mini"></div>
      <div style="flex:1;min-width:0">
        <div class="nt">${esc(cur.title)}</div>
        <div class="ns">${esc(cur.author||'')} · ${S.chapter}장 · ${done}%</div>
        <div class="bar"><i style="width:${done}%"></i></div>
      </div></button>`;
  }
  /* 내가 넣은 책은 맨 위에 따로 둔다. 작가별 선반에 섞으면 한 권짜리 선반이
     작가 수만큼 생기고, 정작 내가 넣은 책을 찾으려면 한참 내려가야 한다.
     영어 원서 서재도 같은 자리에 '내 책' 을 둔다. */
  const mine=MANIFEST.filter(m=>m.local);
  if(mine.length) html+=`<div class="shelf"><div class="sh-h"><span class="dot"></span>
      <span class="nm">📥 내 책</span><span class="ct">${mine.length}권</span></div>${rail(mine)}</div>`;
  const verse=MANIFEST.filter(m=>m.kind==='verse'&&!m.local);
  if(verse.length) html+=`<div class="shelf"><div class="sh-h"><span class="dot"></span>
      <span class="nm">시</span><span class="ct">${verse.length}권</span></div>${rail(verse)}</div>`;
  const by={};
  MANIFEST.filter(m=>m.kind!=='verse'&&!m.local).forEach(m=>{ (by[m.author]=by[m.author]||[]).push(m); });
  Object.keys(by).sort((a,b)=>by[b].length-by[a].length).forEach(a=>{
    html+=`<div class="shelf"><div class="sh-h"><span class="dot"></span>
      <span class="nm">${esc(a)}</span><span class="ct">${by[a].length}편</span></div>${rail(by[a])}</div>`;
  });
  return html;
}

/* ============ 설정 ============ */
/* 열 때 판 높이를 화면에 맞춘다. max-height 를 CSS 상수로 두면 사이트 탭과
   머리말 높이가 화면 폭마다 달라져서 몇십 픽셀씩 아래로 삐져나간다. */
function fitMenu(el){
  if(!el||!el.classList.contains('show')) return;
  el.style.maxHeight='';
  const top=el.getBoundingClientRect().top;
  el.style.maxHeight=Math.max(220,innerHeight-top-12)+'px';
}
function applyTheme(){
  renderThemePickers();
  const d=document.documentElement;
  d.setAttribute('data-theme',S.theme);
  const fmap={gothic:'var(--gothic)',myeongjo:'var(--myeongjo)',
    ridi:'var(--ridi)',barun:'var(--barun)',bon:'var(--bonmyeongjo)',
    gowun:'var(--gowun)',pretendard:'var(--pretendard)'};
  d.style.setProperty('--reading-font', fmap[S.font]||'var(--myeongjo)');
  d.style.setProperty('--fs',S.fs+'px');
  d.style.setProperty('--lh',S.lh);
  d.style.setProperty('--measure',S.measure);
  const bd=$('#readBody');
  if(bd) bd.classList.toggle('indent', S.para==='indent' && !isVerse());
  $$('#optTheme button, #thememenu button').forEach(b=>b.classList.toggle('on',b.dataset.theme===S.theme));
  /* 휴대폰 주소창도 같이 물들여야 테마가 화면 끝까지 이어진다 */
  const th=THEMES.find(t=>t.k===S.theme)||THEMES[0];
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.content=th.c);
  const tb=$('#btnTheme');
  if(tb){ tb.title='테마: '+th.n+' (눌러서 바꾸기)';
    tb.setAttribute('aria-label',tb.title);
    tb.innerHTML=`<span class="set-swatch" style="background:${th.c}"></span>`; }
  $$('#optFont button').forEach(b=>b.classList.toggle('on',b.dataset.font===S.font));
  $$('#optLh button').forEach(b=>b.classList.toggle('on',+b.dataset.lh===+S.lh));
  $$('#optMeasure button').forEach(b=>b.classList.toggle('on',b.dataset.measure===S.measure));
  $$('#optPara button').forEach(b=>b.classList.toggle('on',b.dataset.para===S.para));
  const r=$('#fsRange'); if(r){ r.value=S.fs; $('#fsVal').textContent=S.fs+'px'; }
  requestAnimationFrame(()=>pgRelayout());
}
function bindChrome(){
  /* 좁은 화면에서 옆단은 ☰ 로 여는 서랍이 된다 */
  const mb=$('#menuBtn'), ov=$('#overlay');
  if(mb) mb.addEventListener('click',()=>document.body.classList.toggle('drawer'));
  if(ov) ov.addEventListener('click',closeDrawer);
  addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
  /* 머리말 높이는 브랜드가 두 줄이라 폭에 따라 달라진다 — 바뀔 때마다 다시 잰다 */
  addEventListener('resize',sbHeight);
  sbHeight();
  $('#btnLib').addEventListener('click',()=>openLib(true));
  $('#btnMark').addEventListener('click',toggleMark);
  $('#btnToc').addEventListener('click',openToc);
  const sb=$('#btnSet'), sm=$('#setmenu');
  sb.addEventListener('click',e=>{ e.stopPropagation(); sm.classList.toggle('show');
    if(sm.classList.contains('show')) renderCloudBox(); fitMenu(sm); });
  addEventListener('resize',()=>{ fitMenu(sm); fitMenu($('#thememenu')); });
  document.addEventListener('click',e=>{ if(!sm.contains(e.target)&&e.target!==sb) sm.classList.remove('show'); });
  /* 머리말 ◐ 와 설정 속 테마 줄은 같은 단추 묶음이다. 단추를 다시 그려도
     끊기지 않게 상자에 한 번만 걸어 둔다. */
  const tb=$('#btnTheme'), tm=$('#thememenu');
  const shutTheme=()=>{ tm.classList.remove('show'); tb.setAttribute('aria-expanded','false'); };
  tb.addEventListener('click',e=>{ e.stopPropagation();
    const on=!tm.classList.contains('show');
    tm.classList.toggle('show',on); tb.setAttribute('aria-expanded',String(on)); fitMenu(tm); });
  document.addEventListener('click',e=>{ if(!tm.contains(e.target)&&e.target!==tb) shutTheme(); });
  addEventListener('keydown',e=>{ if(e.key==='Escape') shutTheme(); });
  [$('#optTheme'),tm].forEach(box=>box&&box.addEventListener('click',e=>{
    const b=e.target.closest('[data-theme]'); if(!b) return;
    S.theme=b.dataset.theme; save(); applyTheme(); shutTheme(); }));
  $$('#optFont button').forEach(b=>b.addEventListener('click',()=>{ S.font=b.dataset.font; save(); applyTheme(); }));
  $$('#optLh button').forEach(b=>b.addEventListener('click',()=>{ S.lh=+b.dataset.lh; save(); applyTheme(); }));
  $$('#optMeasure button').forEach(b=>b.addEventListener('click',()=>{ S.measure=b.dataset.measure; save(); applyTheme(); }));
  $$('#optPara button').forEach(b=>b.addEventListener('click',()=>{ S.para=b.dataset.para; save(); applyTheme(); }));
  $('#fsRange').addEventListener('input',e=>{ S.fs=+e.target.value; save(); applyTheme(); });
  $('#fsMinus').addEventListener('click',()=>{ S.fs=Math.max(15,S.fs-1); save(); applyTheme(); });
  $('#fsPlus').addEventListener('click',()=>{ S.fs=Math.min(32,S.fs+1); save(); applyTheme(); });
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); pgNext(); }
    if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); pgPrev(); }
  });
  let rt=null;
  addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>pgRelayout(),180); });
}

const BUILD='0825-ko-01';
async function init(){
  bindChrome(); applyTheme();
  try{ await loadManifest(); }
  catch(e){ $('#main').innerHTML='<div class="empty">책 목록을 불러오지 못했어요.</div>'; return; }
  const first=(MANIFEST.find(m=>m.id===S.bookId)||MANIFEST[0]);
  if(first) await openBook(first.id, S.bookId===first.id? S.chapter : null);
  applyTheme();
  cloudBoot();
  console.log('한국 문학 서재', BUILD, MANIFEST.length+'권');
}
init();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
