function txtLines(text){
  const lines=[];
  /* 구텐베르크 평문에는 삽화·판권 덩어리가 본문 사이에 섞여 있다.
     [Illustration: … [_Copyright 1894 by George Allen._]]
     대괄호가 다시 닫힐 때까지 통째로 건너뛴다 — 산문은 줄 첫머리를 '[' 로 열지 않는다. */
  let depth=0;
  text.split(/\r?\n/).forEach(raw=>{
    const s=raw.replace(/\s+/g,' ').trim();
    if(depth===0 && /^\[/.test(s)) depth=1, depth+=(s.match(/\[/g)||[]).length-1;
    else if(depth>0) depth+=(s.match(/\[/g)||[]).length;
    if(depth>0){
      depth-=(s.match(/\]/g)||[]).length;
      if(depth<0) depth=0;
      /* 오만과 편견은 장 제목이 삽화 덩어리의 마지막 줄이다:
           [Illustration: ·PRIDE AND PREJUDICE·   …   Chapter I.]
         덩어리를 통째로 버리면 1장이 통째로 사라지므로 제목 줄은 건져낸다. */
      const bare=s.replace(/^[\[\s_]+|[\]\s_]+$/g,'');
      if(bare && bare.length<60 && HEADISH.test(bare))
        lines.push({s:bare, x0:0, x1:bare.length, h:0, yp:0, p:1});
      else
        lines.push({s:'', x0:0, x1:0, h:0, yp:0, p:1});   // 문단 구분은 남긴다
      return;
    }
    lines.push({s, x0:/^\s/.test(raw)?20:0, x1:s.length, h:0, yp:0, p:1});
  });
  return {lines,pages:1,hasFont:false};
}

/* 쪽번호·반복 머리말 제거 — 같은 높이(y)에 같은 모양으로 반복되는 줄만 지운다.
   위치를 함께 보므로 본문 한가운데 있는 장 번호는 살아남는다. */
function stripFurniture(lines,pages){
  if(pages<4) return lines;
  const key=l=>Math.round(l.yp*40)+'|'+l.s.replace(/\d+/g,'#').toLowerCase();
  const cnt={};
  lines.forEach(l=>{ if(l.s.length<70) cnt[key(l)]=(cnt[key(l)]||0)+1; });
  const th=Math.max(4,pages*0.25);
  return lines.filter(l=>l.s.length>=70||cnt[key(l)]<=th);

/* 목차(Contents) 쪽은 통째로 버린다 — 제목 같은 줄이 몰려 있는 쪽 */
/* 목차 쪽 버리기 — 한 쪽에 제목꼴 줄이 잔뜩 모여 있으면 그 쪽이 목차다.
   쪽이 없는 TXT 는 파일 전체가 p=1 이라 이 셈이 성립하지 않는다.
   (그대로 두면 장이 6개만 넘어도 책 전체를 목차로 보고 통째로 버렸다) */
/* 목차 줄 찾기 — "I. 제목" · "01 제목" 처럼 번호와 제목이 붙은 형태까지 알아본다.
   이걸 못 보면 목차가 통째로 남아, 목차 항목이 장 제목으로 잡히고

const HEADISH=/^(chapter|part|book|stave|adventure|letter|canto)\s+[0-9a-z]+|^(prologue|epilogue|contents)\b|^[IVXLCDM]{1,7}\.?$|^[IVXLCDM]{1,7}\.\s+\S|^\d{1,3}[.\s]\s*[A-Z]/i;

    const per={};
    lines.forEach(l=>{ if(l.s.length<40&&HEADISH.test(l.s)) per[l.p]=(per[l.p]||0)+1; });
    const toc=new Set(Object.keys(per).filter(p=>per[p]>=6).map(Number));
    return toc.size? lines.filter(l=>!toc.has(l.p)) : lines;
  }
  /* TXT — 쪽이 없으니 '촘촘히 몰린 구간'으로 찾는다.
     목차에서는 제목줄이 서로 몇 줄 안에 붙어 있고, 본문에서는 수백 줄씩 떨어져 있다.
     목차 줄인지 본문 제목인지는 '뒤에 무엇이 오는가'로 가른다 —
     목차 줄 뒤에는 또 제목이 오고, 본문 제목 뒤에는 산문이 온다.
     (글자가 같은 줄을 지우는 방식도 해봤지만, Emma·두 도시 이야기처럼
      권마다 1장이 다시 나오는 책에서 진짜 1장 본문이 통째로 날아갔다) */
  const tocish=i=>{

    for(let k=i+1;k<lines.length&&seen<3;k++){
      const t=lines[k].s; if(!t) continue;
      seen++; if(HEADISH.test(t)) return true;

  lines.forEach((l,i)=>{ if(l.s&&l.s.length<120&&HEADISH.test(l.s)&&tocish(i)) idx.push(i); });
  if(idx.length<6) return lines;
  const gap=i=>{ let n=0; for(let k=idx[i]+1;k<idx[i+1];k++) if(lines[k].s) n++; return n; };
  const cut=new Set();
  const flush=run=>{ if(run.length>=6) for(let k=run[0];k<=run[run.length-1];k++) cut.add(k); };
  let run=[idx[0]];
  for(let i=0;i<idx.length-1;i++){
    if(gap(i)<=3) run.push(idx[i+1]);
    else { flush(run); run=[idx[i+1]]; }
  }
  flush(run);
  return cut.size? lines.filter((_,i)=>!cut.has(i)) : lines;
}
function titleCase(s){
  s=String(s).replace(/^[\s\[\](){}.,;:*_-]+|[\s\[\](){}*_-]+$/g,'') || String(s);
  return s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase())
    .replace(/\b(i{1,3}|iv|vi{0,3}|ix|xi{0,3})\b/gi,m=>m.toUpperCase())   // Part Ii → Part II
    .replace(/\bMc([a-z])/g,(m,c)=>'Mc'+c.toUpperCase());                 // Mcfadden → McFadden

/* 첫 몇 쪽에서 가장 큰 글씨 = 제목, 그 다음 = 지은이 (사용자가 고칠 수 있음) */
/* ---- 쪽 자체가 그림인 PDF ----
   Wimpy Kid 처럼 손글씨와 그림이 한 장에 같이 그려진 책은 쪽 전체가 이미지이고,
   그 위에 보이지 않는 글자층이 덮여 있다. 글자만 뽑으면 그림이 통째로 사라지므로,
   쪽 그림을 그대로 두고 글자층 자리에 누를 수 있는 칸을 얹는다. */
const IMG_W=720, IMG_Q=.72, IMG_MAXPP=14;   // 쪽 너비(px) · 화질 · 한 장(chapter)에 담을 쪽 수

/* 폰트에 유니코드 표가 없으면 글자가 통째로 밀려 나온다 (Wimpy Kid 는 +29).
   흔한 영어 단어가 가장 많이 잡히는 이동값을 찾는다. */
function pdfShift(sample){
  const score=s=>{
    const ws=s.toLowerCase().match(/[a-z]{2,}/g)||[];
    if(ws.length<8) return 0;
    return ws.filter(w=>COMMON.has(w)).length/ws.length;
  };
  let best=0, bestScore=score(sample);
  if(bestScore>=.25) return 0;                       // 이미 멀쩡하다
  for(let d=1;d<128;d++){
    const s=[...sample].map(c=>String.fromCharCode(c.charCodeAt(0)+d)).join('');
    const v=score(s);
    if(v>bestScore){ bestScore=v; best=d; }
  }
  return bestScore>=.25? best : 0;
}
const unshift=(s,d)=>d? [...s].map(c=>String.fromCharCode(c.charCodeAt(0)+d)).join('') : s;

/* 쪽마다 큰 그림 한 장이 실려 있으면 '쪽이 곧 그림'인 책으로 본다.
   그리는 위치(변환행렬)는 pdf.js 내부 좌표라 해석이 까다로워서,
   paintImageXObject 가 들고 있는 그림의 실제 픽셀 크기로 판단한다. */
async function pdfIsImageBook(pdf,lib){
  const N=pdf.numPages;
  const pick=[];                                     // 앞부분만 보면 표지·판권에 속는다 — 고루 뽑는다
  for(let i=0;i<8;i++) pick.push(1+Math.floor(N*(i+.5)/8));
  let big=0;
  for(const n of new Set(pick)){
    const pg=await pdf.getPage(n);
    const ops=await pg.getOperatorList();
    for(let k=0;k<ops.fnArray.length;k++){
      if(ops.fnArray[k]!==lib.OPS.paintImageXObject) continue;
      const a=ops.argsArray[k];                      // [이름, 가로px, 세로px]
      if(a&&a[1]>=400&&a[2]>=400){ big++; break; }
    }
  }
  return big>=Math.min(8,N)*.7;
}

/* 한 줄을 단어 칸으로 쪼갠다 — 글자 수에 비례해 폭을 나눈다 (손글씨라 폭이 대체로 고르다) */
function lineWords(str,x,y,w,h){
  const out=[]; const re=/([A-Za-z][A-Za-z'-]*)|([^A-Za-z]+)/g; let m, at=0;
  const per=str.length? w/str.length : 0;
  while((m=re.exec(str))){
    const seg=m[0];
    if(m[1]){
      const base=seg.toLowerCase().replace(/[^a-z]/g,'');
      if(base) out.push({x:x+at*per, y, w:seg.length*per, h, t:seg, b:base});
    }
    at+=seg.length;
  }
  return out;
}

async function parseImagePdf(pdf,lib,meta,prog){
  const N=pdf.numPages;
  // 이동값은 앞쪽 몇 장으로 한 번만 정한다
  let sample='';
  for(let i=1;i<=Math.min(N,12)&&sample.length<1500;i++){
    sample+=(await (await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ');
  }
  const shift=pdfShift(sample);

  const pages=[];
  const cv=document.createElement('canvas'), cx=cv.getContext('2d');
  for(let i=1;i<=N;i++){
    if(prog) prog(i,N);
    const pg=await pdf.getPage(i);
    const v0=pg.getViewport({scale:1});
    const sc=IMG_W/v0.width;
    const vp=pg.getViewport({scale:sc});
    cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:cx,viewport:vp}).promise;

    const tc=await pg.getTextContent();
    const ws=[], lines=[];
    for(const it of tc.items){
      const s=unshift(it.str,shift).replace(/=/g,' ').trim();
      if(!s) continue;
      const t=lib.Util.transform(vp.transform,it.transform);
      const h=Math.hypot(t[2],t[3])||12, x=t[4], y=t[5]-h, w=(it.width||0)*sc;
      lines.push(s);
      // 0~1 로 저장해 어떤 크기로 보여도 자리가 맞는다
      for(const q of lineWords(s,x,y,w,h))
        ws.push({x:+(q.x/cv.width).toFixed(4), y:+(q.y/cv.height).toFixed(4),
                 w:+(q.w/cv.width).toFixed(4), h:+(q.h/cv.height).toFixed(4), t:q.t, b:q.b});
    }
    pages.push({img:cv.toDataURL('image/webp',IMG_Q), w:ws, text:lines.join(' '), first:(lines[0]||'').trim()});
    if(i%4===0) await new Promise(r=>setTimeout(r));   // 화면이 멈추지 않게 숨을 돌린다
  }

  /* 요일·Chapter 같은 머리글이 나오면 새 장으로 끊고, 너무 길어지면 잘라준다 */
  const HEAD=/^(mon|tues|wednes|thurs|fri|satur|sun)day\b|^(chapter|part|prologue|epilogue)\b/i;
  const chapters=[]; let cur=null;
  pages.forEach(pp=>{
    // 머리글은 쪽의 '첫 줄' 로만 판단한다 — 쪽 전체를 보면 본문 속 요일에도 걸린다
    const first=pp.first||'';
    const head=HEAD.test(first)&&first.split(/\s+/).length<=4;
    if(!cur||(head&&cur.pages.length)||cur.pages.length>=IMG_MAXPP){
      cur={n:chapters.length+1, part:1, title:head? first.slice(0,40) : '', pages:[], paras:[]};
      chapters.push(cur);
    }
    cur.pages.push({img:pp.img,w:pp.w});
    if(pp.text) cur.paras.push(pp.text);
  });
  // 제목이 안 잡힌 장은 쪽 번호로라도 이름을 붙여 목차에서 찾을 수 있게 한다
  let at=1;
  chapters.forEach(c=>{
    const end=at+c.pages.length-1;
    if(!c.title) c.title=(at===end? `${at}쪽` : `${at}–${end}쪽`);
    at=end+1;
    if(!c.paras.length) c.paras=[''];
  });
  const words=pages.reduce((a,p)=>a+((p.text||'').split(/\s+/).filter(Boolean).length),0);
  return {id:meta.id,title:meta.title,author:meta.author,lang:'en',local:true,kind:'image',
          words,parts:{},chapters};
}

function guessMeta(inp){
  if(!inp.hasFont) return {title:'',author:''};
  const front=inp.lines.filter(l=>l.p<=4&&l.s.length>2&&l.s.length<=60)
    .slice().sort((a,b)=>b.h-a.h);
  if(!front.length) return {title:'',author:''};
  const t=front[0];
  const a=front.find(x=>x.s!==t.s&&x.h>=t.h*0.6);
  return {title:titleCase(t.s), author:a?titleCase(a.s):''};
}

const clean=t=>String(t||'').replace(/^[\s\[\](){}.,;:*_-]+|[\s\[\](){}.,;:*_-]+$/g,'');
function linesToBook(inp,meta){
  let lines=stripFurniture(inp.lines,inp.pages);
  lines=dropTOC(lines,inp.pages);
  const med=a=>a.length? a.slice().sort((x,y)=>x-y)[Math.floor(a.length/2)] : 0;
  // 본문 글자 크기 = 긴 줄들의 중앙값. 이보다 확실히 크면 제목 줄로 본다.
  const bodyH=inp.hasFont? (med(lines.filter(l=>l.s.length>60).map(l=>l.h))||med(lines.map(l=>l.h))) : 0;
  const big=l=> inp.hasFont ? (bodyH>0 && l.h>=bodyH*1.15 && l.s.length<=44) : (l.s.length<60);
  const txt=lines.filter(l=>l.s);
  const xs=txt.map(l=>l.x0).sort((a,b)=>a-b);
  const rs=txt.map(l=>l.x1).sort((a,b)=>a-b);
  const mL=xs.length? xs[Math.floor(xs.length*0.2)] : 0;
  const mR=rs.length? rs[Math.floor(rs.length*0.8)] : 1e9;
  /* 줄을 훑어 장으로 나눈다. 한 번 훑어보고 장이 거의 안 나왔는데 'Book I' 같은
     파트 제목만 잔뜩이면, 그 책은 파트가 곧 장이다 — 그때만 다시 훑는다.
     (오디세이는 BOOK I~XXIV 가 장인데, 파트로 보면 본문이 서문 한 장에 통째로 뭉쳤다) */
  function scan(partsAsChapters){
  const chapters=[]; const partName={}; let part=1, cur=null, prev=null, numbered=0;
  const open=(title)=>{ cur={n:chapters.length+1,title,part,paras:[]}; chapters.push(cur); prev=null;
    if(/^(chapter|book)\s/i.test(title)) numbered++; };
  lines.forEach(l=>{
    const s=l.s;
    if(!s){ prev=null; return; }              // 빈 줄(txt) → 문단 구분
    if(big(l)){
      let m;
      if((m=s.match(RX_PART))){
        const pn=rnum(m[1])||wnum(m[1])||part+1;
        if(partsAsChapters){ open('Book '+pn); return; }
        part=pn; partName[part]=titleCase(s); return; }
      if(RX_TOCH.test(s)){ open('__toc__'); return; }   // 목차표 — 아래에서 버린다
      if(RX_HEAD.test(s)){ open(titleCase(s)); return; }
      if((m=s.match(RX_ORD))){ const n=onum(m[1]); if(n){ open('Chapter '+n); return; } }
      if((m=s.match(RX_CHAP))){ const n=rnum(m[1])||wnum(m[1]);
        const sub=clean(m[2]);
        open('Chapter '+(n||m[1])+(sub?' · '+sub:'')); return; }
      const wn=wnum(s); if(wn){ open('Chapter '+wn); return; }       // "ONE", "TWENTY-TWO"
      if(RX_NUM.test(s)){ open('Chapter '+s); return; }              // "1", "2"
      if((m=s.match(RX_NUMT)) && +m[1]===numbered+1){
        open('Chapter '+(+m[1])+' · '+clean(m[2])); return; }
      if((m=s.match(RX_ROMANT)) && rnum(m[1])===numbered+1){
        open('Chapter '+rnum(m[1])+' · '+clean(m[2])); return; }
      if((m=s.match(RX_ROMAN))){ const n=rnum(m[1]); if(n){ open('Chapter '+n); return; } }
      /* Stave One / Adventure I. / Section 1.
         뒤에 진짜 번호가 올 때만 장으로 연다 — 전에는 아무 낱말이나 받아서
         본문 속 "Letter ran…" 같은 짧은 줄이 장 제목이 되어 책이 두 동강 났다 */
      if((m=s.match(RX_SECT))){
        const n=rnum(m[2])||wnum(m[2]);
        if(n){ const sub=clean(m[3]);
          open(titleCase(m[1])+' '+n+(sub?' · '+sub:'')); return; } }
      if(inp.hasFont){ open(titleCase(s)); return; }                 // 그 밖의 큰 글씨 = 제목
    }
    if(!cur) open('Opening');
    const last=cur.paras[cur.paras.length-1];
    const brk = !last || RX_BREAK.test(s) ||
      (inp.hasFont ? (l.x0>mL+5 || (prev && prev.x1<mR-30)) : !prev);
    if(brk) cur.paras.push(s);
    else if(/[A-Za-z]-$/.test(last)) cur.paras[cur.paras.length-1]=last.slice(0,-1)+s;
    else cur.paras[cur.paras.length-1]=last+' '+s;
    prev=l;
  });
  return {chapters,partName};
  }
  const meaty=c=>c.paras.join(' ').split(/\s+/).filter(Boolean).length>=40;
  let {chapters,partName}=scan(false);
  /* 알맹이 있는 장이 둘 이하인데 파트는 넷 이상 — 파트가 곧 장인 책이다 */
  if(chapters.filter(c=>c.title!=='__toc__'&&meaty(c)).length<=2
     && Object.keys(partName).length>=4){
    ({chapters,partName}=scan(true));
  }
  // 목차 항목·속표지처럼 본문이 거의 없는 장은 버린다
  /* 목차표로 열린 장은 버린다 — 다만 그것밖에 없으면 그게 본문이다.
     장 제목이 하나도 없는 책(단편 모음 등)은 'Contents' 한 줄에 책 전체가 담긴다. */
  let kept=chapters.filter(c=>c.title!=='__toc__' && meaty(c));
  if(kept.length<2) kept=chapters.filter(meaty).map(c=>
    c.title==='__toc__'? Object.assign({},c,{title:'Opening'}) : c);
  if(!kept.length) throw new Error('본문을 찾지 못했어요');
  // 첫 구조적 제목(Prologue/Chapter/Part) 앞의 속표지·판권 페이지는 버린다
  const firstReal=kept.findIndex(c=>/^(prologue|chapter\s|part\s)/i.test(c.title));
  const body=firstReal>0? kept.slice(firstReal) : kept;
  // 파트 번호를 1..n 으로 정리
  const used=[...new Set(body.map(c=>c.part))].sort((a,b)=>a-b);
  const parts={};
  body.forEach((c,i)=>{
    const np=used.indexOf(c.part)+1;
    if(used.length>1) parts[np]=partName[c.part]||('Part '+np);
    c.part=used.length>1?np:1; c.n=i+1;
  });
  const words=body.reduce((a,c)=>a+c.paras.join(' ').split(/\s+/).filter(Boolean).length,0);
  return {id:meta.id,title:meta.title,author:meta.author,lang:'en',local:true,words,parts,chapters:body};
}
/* 파일 내용(SHA-256)으로 id 를 만든다.
   같은 책을 다시 넣어도 같은 id 가 나오므로 읽던 진도·단어가 그대로 이어진다.
   (crypto.subtle 은 https/localhost 에서만 동작 — 아니면 시간값으로 대체) */
async function fileId(file){
  try{
    const h=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());
    return LP+[...new Uint8Array(h)].slice(0,8).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return LP+Date.now().toString(36); }
}
/* 저장공간이 부족할 때 브라우저가 내 책을 임의로 지우지 않도록 요청 */
async function requestPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist) return false;
    if(await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  }catch(e){ return false; }
}

/* ---- 백업: 내보내기 / 불러오기 ----
   기기를 옮기거나, 브라우저가 저장 데이터를 지웠을 때 되돌리기 위한 것.
   내 책 + 읽은 챕터 + 단어장이 파일 하나에 들어간다. */
async function exportBackup(){
  try{
    const books=(await idbAll())||[];
    const st={...S}; delete st._q; delete st._part;      // 화면 임시상태는 뺀다
    const data={app:'bookstudy',kind:'backup',v:1,at:new Date().toISOString(),state:st,books};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const d=new Date(), pad=n=>String(n).padStart(2,'0');
    const a=document.createElement('a');
    a.href=url; a.download=`bookstudy-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast(`백업 저장 — 내 책 ${books.length}권`);
    logEvent('💾','백업 내보내기 — 내 책 '+books.length+'권');
  }catch(e){ console.error(e); toast('백업을 만들지 못했어요'); }
}
/* 되돌릴 때는 기존 것을 지우지 않고 합친다 */
async function restoreBackup(data,quiet){
  const books=Array.isArray(data.books)?data.books:[];
  let added=0, dup=0;
  for(const raw of books){
    const b=fixBook(raw);
    if(!b||!b.id||!Array.isArray(b.chapters)||!b.chapters.length) continue;
    if(await idbGet(b.id).catch(()=>null)){ dup++; continue; }
    try{ await idbPut(b.id,b); metaPut(b); added++; }
    catch(e){ toast('저장 공간이 부족해요'); break; }
  }
  const st=data.state||{};
  S.read=Object.assign({},st.read||{},S.read);                 // 읽은 챕터: 합집합
  const ch=Object.assign({},st.chapters||{});                  // 마지막 챕터: 더 뒤쪽
  Object.keys(S.chapters||{}).forEach(k=>ch[k]=Math.max(ch[k]||0,S.chapters[k]||0));
  S.chapters=ch;
  const w=Object.assign({},st.words||{});                      // 단어장: 최근 저장분 우선
  Object.keys(S.words||{}).forEach(k=>{
    if(!w[k]||(S.words[k].t||0)>=(w[k].t||0)) w[k]=S.words[k];
  });
  S.words=w;
  save(); requestPersist();
  MANIFEST=MANIFEST.filter(m=>!m.local).concat(await localManifest());
  if(!quiet){
    closeImport();
    toast(`복원 완료 — 책 ${added}권 추가${dup?`, ${dup}권은 이미 있음`:''}`);
  }
  if(added) logEvent('📥','백업 불러오기 — 책 '+added+'권 추가');
  if(MANIFEST.find(m=>m.id===S.bookId)){ setNav(); renderSidebar(); renderMain(); }
  else if(MANIFEST.length) await switchBook(MANIFEST[0].id);
}

/* ---- 자동 동기화 (Firebase Realtime Database) ----
   로그인도, 기기마다 붙여넣는 설정도 없다 — 앱을 열기만 하면 모든 기기가 같은 곳을 본다.
   주소는 앱에 박혀 있고 REST 로만 쓰므로 SDK 를 받아올 필요도 없다.
   가벼운 것(진도·단어장)은 state 아래, 무거운 것(책 본문)은 books 아래로 나눠 둔다.
   20초마다 도는 폴링이 책 본문까지 끌어오지 않게 하려는 것. */
const RTDB_URL='https://wall-street-57bf4-default-rtdb.firebaseio.com';
const RTDB_PATH='bookstudy';                 // WSJ 앱과 같은 DB, 경로만 나눠 쓴다
const UP_KEY='bookstudy_uploaded';           // 이미 올린 책 — 매번 다시 올리지 않으려고
let rtBusy=false, pushTimer=null, pollTimer=null, rtErr='', appReady=false, lastSync=0;

/* RTDB 키에 못 쓰는 글자(. # $ / [ ])를 되돌릴 수 있게 바꾼다.
   '%' 도 함께 바꿔야 되돌릴 때 원래 '%' 와 섞이지 않는다. */
const rtEnc=k=>String(k).replace(/[%.#$/[\]]/g,c=>'%'+c.charCodeAt(0).toString(16));
const rtDec=k=>String(k).replace(/%([0-9a-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));

function rtErrText(s){
  if(s===401||s===403) return '데이터베이스 규칙이 막고 있어요 — Rules 에서 '+RTDB_PATH+' 경로를 열어주세요';
  if(s===404) return '데이터베이스 주소를 찾지 못했어요';
  return '동기화하지 못했어요 (네트워크를 확인해 주세요)';
}
async function rtReq(method,sub,body,query){
  const q=[query||'', method==='GET'?'t='+Date.now():''].filter(Boolean).join('&');
  const url=RTDB_URL+'/'+RTDB_PATH+(sub?'/'+sub:'')+'.json'+(q?'?'+q:'');
  const opt={method,cache:'no-store'};
  if(body!==undefined){ opt.headers={'Content-Type':'application/json'}; opt.body=JSON.stringify(body); }
  const r=await fetch(url,opt);
  if(!r.ok){ const e=new Error(rtErrText(r.status)); e.status=r.status; throw e; }
  return r.status===200? r.json() : null;
}
/* 올린 책을 '올렸다/안 올렸다'로만 적어두면, 책에 손번역을 넣어도 다시 올라가지 않는다.
   그래서 책마다 마지막으로 고친 시각을 적어 두고, 그 시각이 달라졌을 때만 올린다. */
function uploadedMap(){
  try{ const v=JSON.parse(localStorage.getItem(UP_KEY)||'{}');
    if(Array.isArray(v)){ const o={}; v.forEach(id=>o[id]=0); return o; }   // 예전 판(목록)에서 넘어온다
    return (v&&typeof v==='object')? v : {};
  }catch(e){ return {}; }
}
function markUploaded(m){ try{ localStorage.setItem(UP_KEY,JSON.stringify(m)); }catch(e){} }
function upForget(id){ const m=uploadedMap(); delete m[id]; markUploaded(m); }
/* 책을 고칠 때마다 시각을 새긴다 — 이 시각 하나로 올릴지, 받을지를 정한다 */
function stamp(b){ if(b) b.t=Date.now(); return b; }

/* 내려받아 합친다 — 지우지 않고, 더 많이 읽은 쪽·더 최근에 저장한 단어를 남긴다.
   applyLast 는 앱을 막 열었을 때만 참 — 읽는 도중 폴링이 화면을 옮겨버리면 안 된다. */
async function rtPull(applyLast){
  const [d,ids]=await Promise.all([
    rtReq('GET','state'),
    rtReq('GET','books',undefined,'shallow=true').catch(()=>null)
  ]);
  const before=JSON.stringify([S.chapters,S.read,S.words,S.marks]);
  let added=0, upd=0;

  if(d){
    /* 무덤부터 합친다 — 지운 것을 되살리지 않으려면 병합보다 먼저 알아야 한다 */
    const rd_=d.deleted||{};
    ['w','b','m'].forEach(kind=>{
      const src={w:rd_.words,b:rd_.books,m:rd_.marks}[kind]||{};
      Object.entries(src).forEach(([k,t])=>{ const n=rtDec(k);
        S.del[kind][n]=Math.max(S.del[kind][n]||0,+t||0); });
    });

    const ch=Object.assign({},S.chapters||{});
    Object.entries(d.chapters||{}).forEach(([k,v])=>{ const n=rtDec(k); ch[n]=Math.max(ch[n]||0,+v||0); });
    S.chapters=ch;

    const rd=Object.assign({},S.read||{});
    Object.keys(d.read||{}).forEach(k=>{ rd[rtDec(k)]=1; });
    S.read=rd;

    const w=Object.assign({},S.words||{});
    Object.entries(d.words||{}).forEach(([k,v])=>{ const n=rtDec(k);
      if(!v||(v.t||0)<=(S.del.w[n]||0)) return;        // 지운 뒤에 올라온 게 아니면 무시
      if(!w[n]||(v.t||0)>(w[n].t||0)) w[n]=v; });
    Object.keys(S.del.w).forEach(n=>{                  // 다른 기기가 지운 것은 여기서도 지운다
      if(w[n]&&(w[n].t||0)<=S.del.w[n]) delete w[n]; });
    S.words=w;

    const mk=new Map((S.marks||[]).map(m=>[m.id,m]));
    Object.values(d.marks||{}).forEach(m=>{
      if(!m||!m.id||(S.del.m[m.id]||0)>=(m.t||0)) return;
      const cur=mk.get(m.id); if(!cur||(m.t||0)>(cur.t||0)) mk.set(m.id,m); });
    /* 지운 뒤에 다시 만든 표시까지 없애면 안 된다 — 지운 시각보다 새것이면 남긴다 */
    Object.entries(S.del.m).forEach(([id,t])=>{ const cur=mk.get(id);
      if(cur&&(cur.t||0)<=(+t||0)) mk.delete(id); });
    S.marks=[...mk.values()].sort((a,b)=>b.t-a.t).slice(0,300);

    const pp=Object.assign({},S.pagePos||{});
    Object.entries(d.pagePos||{}).forEach(([k,v])=>{ const n=rtDec(k); pp[n]=Math.max(pp[n]||0,+v||0); });
    S.pagePos=pp;
  }

  /* 책마다 마지막으로 고친 시각 — state 를 받을 때 함께 와서, 책을 열어보지 않고도
     저쪽이 더 새것인지 알 수 있다. 이것이 없으면 여기 있는 책은 영영 다시 받지 않아
     다른 기기에서 넣은 손번역이 건너오지 못한다. */
  const rbt=(d&&d.bookT)||{};

  // 다른 기기가 지운 책은 여기서도 치운다 — 단, 지운 뒤에 다시 넣은 책은 남긴다
  for(const [id,t] of Object.entries(S.del.b)){
    const cur=await idbGet(id).catch(()=>null);
    if(cur&&(cur.t||0)<(+t||0)){
      await idbDel(id).catch(()=>{}); metaDel(id); delete bookCache[id]; upForget(id);
    }
  }
  // 다른 기기가 올린 책을 받아온다 — 여기 없는 책과, 저쪽이 더 최근에 고친 책
  for(const k of Object.keys(ids||{})){
    const id=rtDec(k), rt=+rbt[k]||0;
    if(S.del.b[id]&&S.del.b[id]>=rt) continue;         // 지운 책은 다시 받지 않는다
    const cur=await idbGet(id).catch(()=>null);
    if(cur&&cur.localOnly) continue;                   // 이 기기에만 두기로 한 책은 건드리지 않는다
    if(cur&&(cur.t||0)>=rt) continue;                  // 여기 것이 저쪽만큼 새것이다
    const b=fixBook(await rtReq('GET','books/'+k).catch(()=>null));
    if(!b||!b.id||!Array.isArray(b.chapters)||!b.chapters.length) continue;
    b.t=rt||Date.now();
    if(cur){
      /* 손번역은 덮지 않고 합친다 — 기기마다 다른 문장을 넣어두었을 수 있다.
         같은 문장이 양쪽에 있으면 이 기기 것을 남기고,
         저쪽에 없는 것을 보탰으면 시각을 올려 다음 번에 다시 올라가게 한다. */
      const mine=cur.ko||{}, theirs=b.ko||{};
      const extra=Object.keys(mine).filter(x=>theirs[x]===undefined).length;
      if(Object.keys(mine).length) b.ko=Object.assign({},theirs,mine);
      if(extra) b.t=Date.now();
      b.localOnly=!!cur.localOnly;
    }
    try{ await idbPut(b.id,b); metaPut(b); delete bookCache[b.id]; cur? upd++ : added++; }
    catch(e){ toast('저장 공간이 부족해요'); break; }
  }

  // 마지막으로 읽던 자리는 앱을 열 때만 따라간다 — 읽는 도중 폴링이 화면을 옮기면 안 된다
  let moved=false;
  if(applyLast&&d&&d.last&&d.last.bookId&&(d.last.t||0)>(S.lastT||0)){
    S.lastT=d.last.t;
    if(d.last.bookId!==S.bookId||d.last.chapter!==S.chapter){
      S.bookId=d.last.bookId; S.chapter=d.last.chapter||1; moved=true;
    }
    if(d.last.page>0) S.pagePos[S.bookId+':'+S.chapter]=d.last.page;   // 읽던 쪽까지 이어받는다
  }
  save();
  return { added, upd, moved,
    changed: added>0||upd>0||moved||before!==JSON.stringify([S.chapters,S.read,S.words,S.marks]) };
}
/* 지운 것을 원격에서도 바로 없앤다 — 오프라인이면 무덤이 다음 동기화에 다시 보낸다 */
function rtDrop(kind,key){
  const node={words:'state/words',marks:'state/marks',books:'books'}[kind];
  if(!node) return;
  rtReq('PATCH',node,{[rtEnc(key)]:null}).catch(e=>console.error(e));
  if(kind==='books') rtReq('PATCH','state/bookT',{[rtEnc(key)]:null}).catch(()=>{});
}

/* 올릴 때는 키 단위 PATCH — 다른 기기가 그 사이 넣은 것을 덮지 않는다 */
async function rtPush(force){
  clearTimeout(pushTimer);
  if(rtBusy&&!force){ cloudTouch(); return false; }   // 맞추는 중이면 조금 뒤에
  const words={}, read={}, chapters={}, marks={}, pagePos={};
  Object.entries(S.words||{}).forEach(([k,v])=>words[rtEnc(k)]=v);
  Object.keys(S.read||{}).forEach(k=>read[rtEnc(k)]=true);
  Object.entries(S.chapters||{}).forEach(([k,v])=>chapters[rtEnc(k)]=v);
  (S.marks||[]).forEach(m=>marks[rtEnc(m.id)]=m);
  Object.entries(S.pagePos||{}).forEach(([k,v])=>pagePos[rtEnc(k)]=v);
  /* 지운 것은 null 로 보내 원격에서도 없앤다 — 무덤은 다른 기기가 읽어갈 수 있게 남긴다 */
  const dw={},db={},dm={};
  Object.entries(S.del.w).forEach(([k,t])=>{ dw[rtEnc(k)]=t; words[rtEnc(k)]=null; });
  Object.entries(S.del.m).forEach(([k,t])=>{ dm[rtEnc(k)]=t; marks[rtEnc(k)]=null; });
  Object.entries(S.del.b).forEach(([k,t])=>db[rtEnc(k)]=t);

  /* 자식 노드마다 따로 보낸다 — PATCH 는 본문 최상위 키를 통째로 갈아끼우므로
     한 번에 {words:…} 로 보내면 그 사이 다른 기기가 넣은 단어가 지워진다 */
  /* 한 걸음이 실패했다고 뒤의 것까지 통째로 건너뛰면, 단어 하나 때문에 책이 안 올라간다.
     그래서 걸음마다 따로 붙잡아 두고, 다 보낸 뒤에 마지막으로 알린다. */
  const fail=[];
  const step=async(sub,body)=>{ try{ await rtReq('PATCH',sub,body); }catch(e){ fail.push(e); } };

  if(Object.keys(words).length) await step('state/words',words);
  if(Object.keys(read).length) await step('state/read',read);
  if(Object.keys(chapters).length) await step('state/chapters',chapters);
  if(Object.keys(marks).length) await step('state/marks',marks);
  if(Object.keys(pagePos).length) await step('state/pagePos',pagePos);
  if(Object.keys(dw).length) await step('state/deleted/words',dw);
  if(Object.keys(dm).length) await step('state/deleted/marks',dm);
  if(Object.keys(db).length){
    await step('state/deleted/books',db);
    const nulls=Object.fromEntries(Object.keys(db).map(k=>[k,null]));
    await step('books',nulls);
    await step('state/bookT',nulls);
  }
  const last={ bookId:S.bookId, chapter:S.chapter, page:pgPage, t:Date.now() };
  await step('state',{last});
  S.lastT=last.t;

  /* 새로 넣은 책과 '고친' 책을 올린다 — 한 권이 수 MB 라 매번 올릴 것이 아니라,
     마지막으로 올린 시각과 지금 책의 시각이 다를 때만 올린다.
     비교는 목록표(localStorage)로 하므로, 안 올릴 책은 IndexedDB 에서 펼치지도 않는다.
     idbAll() 로 다 꺼내면 그림 책 한 권에도 메인 스레드가 통째로 멎는다. */
  const up=uploadedMap();
  const mt={}; (metaAll()||[]).forEach(m=>{ mt[m.id]=m.t||0; });
  for(const id of (await idbKeys())||[]){
    if(mt[id]!==undefined && up[id]===mt[id]) continue;   // 그대로면 들추지 않는다
    const b=await idbGet(id).catch(()=>null);
    if(!b) continue;
    if(!b.t){ stamp(b); await idbPut(id,b).catch(()=>{}); }   // 시각이 없던 옛 책에 새겨 준다
    metaPut(b);
    if(b.localOnly){                             // 이 기기에만 두기로 한 책은 올리지 않는다
      up[id]=b.t; markUploaded(up);              // 다음에 또 들춰보지 않게 시각만 적어둔다
      continue;
    }
    try{
      await rtReq('PUT','books/'+rtEnc(id),b);
      await rtReq('PATCH','state/bookT',{[rtEnc(id)]:b.t});
      up[id]=b.t; markUploaded(up);
      logEvent('☁️','책 올림 — '+(b.title||id));
    }catch(e){ fail.push(e); }                   // 한 권이 막혀도 다음 책은 올린다
  }
  S.cloudAt=fail.length? (S.cloudAt||0) : Date.now();
  save(); clearTimeout(pushTimer);                 // save() 가 다시 잡은 예약을 취소
  if(fail.length) throw fail[0];
  return true;
}

/* 한 번 맞춘다 — 받아서 합치고, 합친 결과를 올린다 */
async function cloudSync(quiet,applyLast){
  if(rtBusy||!appReady) return false;
  if(navigator.onLine===false) return false;
  rtBusy=true;
  try{
    const r=await rtPull(applyLast);
    await rtPush(true);      // 맞추는 중에도 올린다 — rtBusy 를 내리면 폴링과 겹친다
    lastSync=Date.now(); rtErr='';
    if(r.changed){
      MANIFEST=MANIFEST.filter(m=>!m.local).concat(await localManifest());
      if(!MANIFEST.find(m=>m.id===S.bookId)&&MANIFEST.length){
        // 목록이 아직 덜 찼을 수도 있다 — 기기에 정말 없을 때만 다른 책으로 옮긴다
        const have=String(S.bookId).startsWith(LP)? await idbGet(S.bookId).catch(()=>null) : true;
        if(!have) S.bookId=MANIFEST[0].id;
      }
      if(r.moved||r.added){ curBook=await loadBook(S.bookId).catch(()=>curBook); }
      if(!chap(S.chapter)&&curBook) S.chapter=curBook.chapters[0].n;
      setNav(); renderSidebar(); renderMain();
    }
    if(r.added) logEvent('☁️','다른 기기에서 책 '+r.added+'권 받아옴');
    if(r.upd) logEvent('☁️','다른 기기에서 고친 책 '+r.upd+'권 받아옴');
    if(!quiet) toast(r.added||r.upd? `맞췄어요 — 책 ${r.added+r.upd}권 받아옴` : '맞췄어요');
    renderCloudBox();
    return true;
  }catch(e){
    console.error(e); rtErr=e.message||'동기화하지 못했어요';
    if(!quiet) toast(rtErr);
    renderCloudBox(); return false;
  }finally{ rtBusy=false; }
}

/* 바뀔 때마다 곧바로 올리지 않고 잠깐 모았다가 한 번에 */
function cloudTouch(){
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ if(appReady) rtPush().catch(e=>console.error(e)); },4000);
}
function startPoll(){
  clearInterval(pollTimer);
  pollTimer=setInterval(()=>{
    if(document.hidden||navigator.onLine===false||rtBusy) return;
    cloudSync(true,false).catch(e=>console.error(e));
  },20000);
}
/* 앱을 열면 바로 맞추고, 그 뒤로는 알아서 돈다 */
async function cloudBoot(){
  appReady=true;
  await cloudSync(true,true).catch(()=>{});
  startPoll();
}
/* 덮을 때는 모아둔 변경을 바로 올리고, 다시 열 때는 다른 기기의 변경을 받아온다.
   pagehide 는 모바일에서 오지 않는 경우가 있어 visibilitychange 도 함께 본다. */
function cloudFlush(){ clearTimeout(pushTimer); if(appReady) rtPush().catch(()=>{}); }
addEventListener('pagehide',cloudFlush);
addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ cloudFlush(); return; }
  if(Date.now()-lastSync>20000) cloudSync(true,false).catch(e=>console.error(e));
});
addEventListener('online',()=>cloudSync(true,false).catch(()=>{}));

function renderCloudBox(){
  const el=$('#cloudBox'); if(!el) return;
  const when=S.cloudAt? new Date(S.cloudAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',
    hour:'2-digit',minute:'2-digit'}) : null;
  el.innerHTML=`<div class="set-h">☁️ 자동 동기화</div>
    <div class="crow"><span class="dot${rtErr?'':' on'}"></span>

        : `켜짐 — 이 앱을 연 모든 기기가 자동으로 맞춰집니다${when?` · 마지막 ${esc(when)}`:''}`}</span>

    <p class="hint">로그인이 필요 없습니다. 읽은 챕터·단어장·내가 넣은 책이 기기끼리 같아집니다.
      대신 <b>이 앱을 여는 사람은 누구나 같은 데이터를 봅니다</b> — 남에게 보이면 안 되는 파일은 넣지 마세요.</p>`;
  const b=$('#rtNow'); if(b) b.addEventListener('click',()=>cloudSync(false,false));
}

      S.del.b[id]=Date.now();                    // 무덤을 남긴다 — 안 그러면 다시 받아온다
      S.marks=S.marks.filter(m=>m.bookId!==id);  // 그 책의 북마크도 같이 정리
      upForget(id);
      save(); rtDrop('books',id);
      MANIFEST=MANIFEST.filter(x=>x.id!==id);

async function importFile(file){
  await renderImport('busy');
  const setP=(a,b)=>{ const t=$('#pgTxt'), bar=$('#pgBar');
    if(t) t.textContent=b?`${a} / ${b} 쪽`:'해석 중…';
    if(bar) bar.style.width=(b?Math.round(a/b*100):30)+'%'; };
  try{
    const isJson=/\.json$/i.test(file.name);
    const json=isJson? JSON.parse(await file.text()) : null;
    if(json && json.kind==='backup'){ await restoreBackup(json); return; }
    if(json && json.kind==='trans'){ await importTrans(json); return; }

    const id=await fileId(file);
    // 전에 넣은 책이면 다시 해석하지 않고 읽던 곳으로 바로 간다.
    // 다만 예전 버전이 만든 깨진 책이면 그대로 두면 안 되니 다시 해석한다.
    let seen=await idbGet(id).catch(()=>null);
    if(seen&&bookLooksBroken(seen)){ seen=null; toast('예전에 잘못 들어간 책이라 다시 읽을게요'); }
    if(seen){
      bookCache[id]=seen;
      if(!MANIFEST.find(m=>m.id===id)) MANIFEST=MANIFEST.concat([{id,title:seen.title,
        author:seen.author,chapters:seen.chapters.length,words:seen.words,local:true}]);
      closeImport(); await switchBook(id);
      toast('이미 있는 책이에요 — 읽던 곳으로 이동합니다'); return;
    }
    const name=cleanName(file.name);
    let bk;
    if(json){
      if(!json.chapters||!json.chapters.length) throw new Error('형식이 맞지 않아요');
      json.chapters.forEach((c,i)=>{ c.n=c.n||i+1; c.part=c.part||1; });
      bk={...json,id,local:true,parts:json.parts||{},
        words:json.chapters.reduce((a,c)=>a+c.paras.join(' ').split(/\s+/).filter(Boolean).length,0)};
    } else if(/\.pdf$/i.test(file.name)||file.type==='application/pdf'){
      const lib=await ensurePdfjs();
      const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
      if(await pdfIsImageBook(pdf,lib)){
        // 쪽 전체가 그림인 책 — 그림을 그대로 두고 글자층만 얹는다
        bk=await parseImagePdf(pdf,lib,{id,title:name,author:''},setP);
        if(!bk.chapters.length) throw new Error('쪽을 읽지 못했어요');
      }else{
        const inp=await pdfLines(file,setP); setP(1,1);
        const g=guessMeta(inp);
        bk=linesToBook(inp,{id,title:g.title||name,author:g.author||''});
      }
    } else if(/\.epub$/i.test(file.name)||file.type==='application/epub+zip'){
      const ep=await epubLines(file,setP); setP(1,1);
      bk=linesToBook(ep.inp,{id,title:ep.title||name,author:ep.author||''});
      if(!bk.chapters.length) throw new Error('본문을 읽지 못했어요');
    } else {
      bk=linesToBook(txtLines(await file.text()),{id,title:name,author:''});
    }
    _imp=bk; renderImport('meta');
  }catch(e){
    console.error(e);
    toast(String(e.message||e).slice(0,60)||'파일을 읽지 못했어요');
    renderImport();
  }
}
/* 손으로 옮긴 번역을 책에 넣는다 — 문장 글자를 열쇠로 쓴다 */
async function importTrans(data){
  const ko=data.ko||{};
  const keys=Object.keys(ko);
  if(!keys.length){ toast('번역이 비어 있어요'); return; }
  let n=0;
  for(const id of (await idbKeys())||[]){
    const b=await idbGet(id).catch(()=>null);
    if(!b) continue;
    const text=new Set();
    (b.chapters||[]).forEach(c=>(c.paras||[]).forEach(p=>splitSentences(p).forEach(x=>text.add(x.trim()))));
    const hit=keys.filter(k=>text.has(String(k).trim()));
    if(!hit.length) continue;
    b.ko=Object.assign({},b.ko||{});
    hit.forEach(k=>{ b.ko[k]=ko[k]; });
    stamp(b);                                  // 고친 시각을 새겨 다음 동기화에 올라가게
    await idbPut(id,b); delete bookCache[id]; metaPut(b); n+=hit.length;
  }
  keys.forEach(k=>{ const t=String(k).trim().toLowerCase(); if(t) trCache[t]=ko[k]; });
  closeImport();
  toast(n? `번역 ${n}문장을 넣었어요` : '맞는 책을 찾지 못했어요');
  logEvent('🈯','번역 '+n+'문장 넣음');
}
async function saveImported(){
  if(!_imp) return;
  _imp.title=($('#impT').value||'').trim()||'제목 없는 책';
  _imp.author=($('#impA').value||'').trim()||'—';
  stamp(_imp);
  try{ await idbPut(_imp.id,_imp); }
  catch(e){ toast('저장 공간이 부족해요'); return; }
  metaPut(_imp); upForget(_imp.id);
  /* 지웠던 책을 다시 넣었으면 무덤에서 꺼낸다 — 여기서만 지우면 다음 동기화에
     다른 기기의 무덤이 되돌아와 방금 넣은 책을 또 지워버린다 */
  if(S.del.b[_imp.id]){
    delete S.del.b[_imp.id];
    rtReq('PATCH','state/deleted/books',{[rtEnc(_imp.id)]:null}).catch(()=>{});
  }
  requestPersist();   // 브라우저가 임의로 지우지 않도록 (응답을 기다리지 않음)
  bookCache[_imp.id]=fixBook(_imp);
  MANIFEST=MANIFEST.concat([{id:_imp.id,title:_imp.title,author:_imp.author,
    chapters:_imp.chapters.length,words:_imp.words,local:true}]);
  const id=_imp.id; const t=_imp.title;
  closeImport(); await switchBook(id);
  logEvent('📂','내 책 추가 — '+t); toast('서재에 넣었어요');
}

/* ============ Init ============ */
/* 무슨 일이 있어도 '불러오는 중…' 에 갇히지 않게 한다.
   어디서 막혔는지 보여주고, 손으로 빠져나올 수 있는 길을 준다. */
let booted=false;
function bootStuck(why){
  if(booted) return;
  $('#main').innerHTML=`<div class="empty"><div class="big">⚠️</div>
    <p>여는 데 오래 걸리고 있어요.<br><small style="color:var(--faint)">${esc(why||'')} · ${BUILD}</small></p>
    <div class="toolrow" style="justify-content:center;margin-top:14px;flex-wrap:wrap">
      <button class="bigbtn" id="bootRetry">다시 시도</button>
      <button class="bigbtn" id="bootBuiltin">기본 책으로 열기</button>
      <button class="bigbtn" id="bootReset">내 책 목록 새로 읽기</button>
    </div></div>`;
  const on=(id,fn)=>{ const b=$('#'+id); if(b) b.addEventListener('click',fn); };
  on('bootRetry',()=>location.reload());
  on('bootBuiltin',()=>{ S.bookId='holes'; S.chapter=1; save(); location.reload(); });
  on('bootReset',()=>{ try{ localStorage.removeItem(MET_KEY); }catch(e){}
    S.bookId='holes'; S.chapter=1; save(); location.reload(); });
}
const BUILD='0825-0330';
async function init(){
  applyTheme(); bindChrome(); setMastheadVar();
  /* 판 번호를 같이 적는다 — 이게 안 보이면 기기가 아직 옛 코드를 돌리고 있다는 뜻 */
  $('#main').innerHTML='<div class="empty"><div class="big">📖</div><p>불러오는 중…'
    +'<br><small style="color:var(--faint);font-size:11px">'+BUILD+'</small></p></div>';
  const watchdog=setTimeout(()=>bootStuck('책 목록이나 저장소가 응답하지 않습니다'),12000);
  try{
    const r=await withTimeout(fetch('books/manifest.json'),8000,null);
    MANIFEST=r? (await r.json()) : [];
  }catch(e){ MANIFEST=[]; }
  // 내 책 목록은 저장소가 느리면 기다리지 않는다 — 뒤에서 채워 넣는다
  MANIFEST=MANIFEST.concat(await withTimeout(localManifest(),5000,[]));
  if(!MANIFEST.length){ clearTimeout(watchdog); booted=true;
    $('#main').innerHTML='<div class="empty"><div class="big">⚠️</div><p>목록을 불러오지 못했어요.<br>GitHub Pages 등 웹 서버에서 열거나,<br>내 PDF·TXT·EPUB 파일을 열어주세요.</p></div>'; return; }
  /* 목록이 아직 안 왔어도 읽던 책이 내 책이면 그 한 권만 바로 가져온다 —
     목록을 못 기다렸다고 엉뚱한 책으로 열리면 안 된다 */
  if(!MANIFEST.find(m=>m.id===S.bookId)&&String(S.bookId).startsWith(LP)){
    const one=await withTimeout(idbGet(S.bookId).catch(()=>null),6000,null);
    if(one) MANIFEST=MANIFEST.concat([bookMeta(fixBook(one))]);
  }
  if(!MANIFEST.find(m=>m.id===S.bookId)) S.bookId=MANIFEST[0].id;
  curBook=await withTimeout(loadBook(S.bookId),10000,null);
  if(!curBook&&S.bookId!==MANIFEST[0].id){        // 그 책이 말썽이면 다른 책으로라도 연다
    S.bookId=MANIFEST[0].id; S.chapter=1;
    curBook=await withTimeout(loadBook(S.bookId),10000,null);
  }
  clearTimeout(watchdog);
  if(!curBook){ bootStuck('책을 여는 데 실패했습니다'); return; }
  booted=true;
  if(!chap(S.chapter)) S.chapter=S.chapters[S.bookId]||curBook.chapters[0].n;
  if(!chap(S.chapter)) S.chapter=curBook.chapters[0].n;
  setNav(); renderSidebar(); renderMain();
  // 못 기다린 내 책 목록을 뒤늦게 채운다
  metaSync().then(list=>{
    MANIFEST=MANIFEST.filter(m=>!m.local).concat(list);
    renderSidebar();
    if(!MANIFEST.find(m=>m.id===S.bookId)&&MANIFEST.length) return;
  }).catch(()=>{});
}
/* 화면이 준비된 다음에 클라우드를 붙인다 — 목록이 있어야 복원한 책을 열 수 있다 */
init().finally(()=>cloudBoot());

/* 오프라인 지원 — 홈 화면에 추가해 앱처럼 쓸 때 필요 */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
